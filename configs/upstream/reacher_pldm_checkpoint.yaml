output_model_name: reacher_pldm_baseline
exp_name: ${output_model_name}
subdir: ckpt/reacher_pldm_baseline
seed: 3072
num_workers: 6
train_split: 0.9
img_size: 224
patch_size: 14
encoder_scale: tiny
encoder_resnet9: false
train_value_function: false
projector_loss_weight: 0.001
dump_object: true
trainer:
  max_epochs: 10
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0
loader:
  batch_size: 128
  num_workers: ${num_workers}
  drop_last: true
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true
  shuffle: true
optimizer:
  type: AdamW
  lr: 5.0e-05
  weight_decay: 0.001
image_noise:
  type: gaussian_noise
  std_min: 0.0
  std_max: 0.0
  noise_prob: 1
  apply_to_val: false
logger_backend: swanlab
swanlab:
  enabled: true
  config:
    project: worldmodels
    workspace: qunteam
    experiment_name: ${exp_name}
    logdir: swanlab
wandb:
  enabled: true
  config:
    entity: le-wm
    project: le-wm
    name: ${exp_name}
    id: ${subdir}
    resume: allow
    log_model: false
wm:
  type: lewm
  history_size: 3
  num_preds: 1
  embed_dim: 192
  use_proprio: false
  action_dim: 2
  observation_dim: 6
predictor:
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0
loss:
  sigreg:
    enabled: true
    weight: 0.0
  temp_straight:
    enabled: false
    weight: 0.1
  std:
    enabled: true
    weight: 18.0
  std_t:
    enabled: true
    weight: 0.7
  cov:
    enabled: true
    weight: 12.0
  cov_t:
    enabled: true
    weight: 0.0
  temp_align:
    enabled: true
    weight: 0.2
  idm:
    enabled: true
    weight: 0.0
data:
  dataset:
    num_steps: ${eval:'max(${wm.num_preds}, ${oc.select:loss.rollout.steps,0}) + ${wm.history_size}'}
    frameskip: 5
    name: reacher
    keys_to_load:
    - pixels
    - action
    - observation
    keys_to_cache:
    - action
    - observation
