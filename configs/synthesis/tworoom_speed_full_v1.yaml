schema_version: 1
experiment: tworoom_speed_full_v1
task: tworoom
env_id: swm/TwoRoom-v1
profile: independent_geometry_balanced_room_template_lossless
seed: 20260716
scenario_generation_seed: 20260716

stable_worldmodel:
  repo: ../stable-worldmodel
  expected_ref: 5864b74980f6ed328fd0045e777b3865962eff43

collection:
  staging_root: /tmp
  episodes_per_scenario: 1
  max_episode_steps: 100
  image_shape: [224, 224]
  num_envs: 1
  pixel_codec:
    format: png
    compress_level: 1
  policy:
    action_noise: 2.0
    action_repeat_prob: 0.05

original_dataset:
  path: ../../data/world_model/quentinll/lewm-tworooms/tworoom.h5

output:
  data_root: artifacts/synthesis/data/tworoom_speed_full_v1
  manifest: artifacts/synthesis/manifests/tworoom_speed_full_v1.jsonl
  report: artifacts/synthesis/reports/tworoom_speed_full_v1.json
  catalog: artifacts/synthesis/catalogs/tworoom_speed_full_v1.json

planning:
  estimated_lance_bytes_per_row: 6500

validation:
  scenario_validation_workers: 16
  numeric_atom_isolation:
    atom: agent_speed
    minimum_cross_split_gap: 0.08
  independent_seed_assignment:
    atom: agent_speed
    splits:
      train:
        minimum_seed_groups: 512
        minimum_factor_values: 32
        minimum_scenarios_per_factor: 16
        minimum_episodes_per_factor: 512
        require_one_scenario_per_seed_group: true
        require_factor_balance: true
      val:
        minimum_seed_groups: 96
        minimum_factor_values: 8
        minimum_scenarios_per_factor: 12
        minimum_episodes_per_factor: 192
        require_one_scenario_per_seed_group: true
        require_factor_balance: true
  minimum_episode_start_oracle:
    minimum_rows: 2
    termination_radius: 16.0
    minimum_guaranteed_margin: 8.0
  speed_frame_skip_oracle:
    seed: 314159
    slow_speed: 3.0
    multiplier: 2
    cases:
      - state: [40.0, 40.0]
        target_state: [190.0, 190.0]
        action: [0.5, 0.25]
      - state: [70.0, 170.0]
        target_state: [190.0, 30.0]
        action: [-0.25, -0.5]
      - state: [50.0, 100.0]
        target_state: [190.0, 180.0]
        action: [0.5, -0.25]
  reset_coverage:
    grid_size: 14
    splits:
      train:
        unique_reset_seeds: 16384
        unique_start_states: 16384
        unique_goal_states: 16384
        start_grid_bins: 150
        goal_grid_bins: 150
        start_goal_grid_pairs: 5000
        cross_room_resets: 8192
        same_room_resets: 8192
        left_to_right_resets: 2500
        right_to_left_resets: 2500
        minimum_initial_distance: 36.0
        initial_distance_p10: 36.0
        templates:
          s0: {start_grid: [3, 5], goal_grid: [13, 13], minimum_resets: 1024}
          s1: {start_grid: [3, 10], goal_grid: [13, 13], minimum_resets: 1024}
          s2: {start_grid: [12, 5], goal_grid: [13, 13], minimum_resets: 1024}
          s3: {start_grid: [12, 10], goal_grid: [13, 13], minimum_resets: 1024}
      val:
        unique_reset_seeds: 1536
        unique_start_states: 1536
        unique_goal_states: 1536
        start_grid_bins: 120
        goal_grid_bins: 120
        start_goal_grid_pairs: 700
        cross_room_resets: 768
        same_room_resets: 768
        minimum_initial_distance: 36.0
        templates:
          s0: {start_grid: [3, 5], goal_grid: [13, 13], minimum_resets: 128}
          s1: {start_grid: [3, 10], goal_grid: [13, 13], minimum_resets: 128}
          s2: {start_grid: [12, 5], goal_grid: [13, 13], minimum_resets: 128}
          s3: {start_grid: [12, 10], goal_grid: [13, 13], minimum_resets: 128}

# A seed group appears in exactly one scenario.  The factor assignment cycles
# over the fixed speed list so factor counts are exactly balanced without
# duplicating reset geometry across speeds.
scenario_sets:
  - name_prefix: train_broad_cross
    split: train
    regime: train_broad_cross
    atom: agent_speed
    assignment: paired_cycle
    episodes_per_scenario: 32
    seed_groups: {sampler: indexed, prefix: speedfull_train_broad_cross, count: 192, width: 4}
    values: &train_speeds
      sampler: fixed
      values: [2.6, 2.7, 2.8, 2.9, 3.1, 3.3, 3.5, 3.7, 3.8, 3.9, 4.1, 4.2, 4.4, 4.5, 4.7, 5.0, 5.1, 5.3, 5.5, 5.7, 5.9, 6.1, 6.2, 6.3, 6.6, 6.7, 6.8, 7.0, 7.2, 7.3, 7.8, 7.9]
    reset_constraints: &cross_constraints
      target_room: opposite
      exclude_wall_zone: true
      minimum_initial_distance: 40.0

  - name_prefix: train_broad_same
    split: train
    regime: train_broad_same
    atom: agent_speed
    assignment: paired_cycle
    allow_value_reuse: true
    episodes_per_scenario: 32
    seed_groups: {sampler: indexed, prefix: speedfull_train_broad_same, count: 192, width: 4}
    values: *train_speeds
    reset_constraints: &same_constraints
      target_room: same
      exclude_wall_zone: true
      minimum_initial_distance: 40.0

  - &train_template
    name_prefix: train_template_s0
    split: train
    regime: train_template_s0
    atom: agent_speed
    assignment: paired_cycle
    allow_value_reuse: true
    episodes_per_scenario: 32
    seed_groups: {sampler: indexed, prefix: speedfull_train_template_s0, count: 32, width: 4}
    values: *train_speeds
    reset_constraints:
      target_room: opposite
      minimum_initial_distance: 36.0
      agent_position_bounds: [[42.1, 55.9], [70.1, 83.9]]
      target_position_bounds: [[182.1, 195.9], [182.1, 195.9]]

  - <<: *train_template
    name_prefix: train_template_s1
    regime: train_template_s1
    seed_groups: {sampler: indexed, prefix: speedfull_train_template_s1, count: 32, width: 4}
    reset_constraints:
      target_room: opposite
      minimum_initial_distance: 36.0
      agent_position_bounds: [[42.1, 55.9], [140.1, 153.9]]
      target_position_bounds: [[182.1, 195.9], [182.1, 195.9]]

  - <<: *train_template
    name_prefix: train_template_s2
    regime: train_template_s2
    seed_groups: {sampler: indexed, prefix: speedfull_train_template_s2, count: 32, width: 4}
    reset_constraints:
      target_room: same
      minimum_initial_distance: 36.0
      agent_position_bounds: [[168.1, 181.9], [70.1, 83.9]]
      target_position_bounds: [[182.1, 195.9], [182.1, 195.9]]

  - <<: *train_template
    name_prefix: train_template_s3
    regime: train_template_s3
    seed_groups: {sampler: indexed, prefix: speedfull_train_template_s3, count: 32, width: 4}
    reset_constraints:
      target_room: same
      minimum_initial_distance: 36.0
      agent_position_bounds: [[168.1, 181.9], [140.1, 153.9]]
      target_position_bounds: [[182.1, 195.9], [182.1, 195.9]]

  - name_prefix: val_broad_cross
    split: val
    regime: validation_broad_cross
    atom: agent_speed
    assignment: paired_cycle
    episodes_per_scenario: 16
    seed_groups: {sampler: indexed, prefix: speedfull_val_broad_cross, count: 32, width: 4}
    values: &val_speeds
      sampler: fixed
      values: [2.5, 3.2, 4.3, 4.6, 4.9, 5.4, 5.6, 5.8]
    reset_constraints: *cross_constraints

  - name_prefix: val_broad_same
    split: val
    regime: validation_broad_same
    atom: agent_speed
    assignment: paired_cycle
    allow_value_reuse: true
    episodes_per_scenario: 16
    seed_groups: {sampler: indexed, prefix: speedfull_val_broad_same, count: 32, width: 4}
    values: *val_speeds
    reset_constraints: *same_constraints

  - &val_template
    name_prefix: val_template_s0
    split: val
    regime: validation_template_s0
    atom: agent_speed
    assignment: paired_cycle
    allow_value_reuse: true
    episodes_per_scenario: 16
    seed_groups: {sampler: indexed, prefix: speedfull_val_template_s0, count: 8, width: 4}
    values: *val_speeds
    reset_constraints:
      target_room: opposite
      minimum_initial_distance: 36.0
      agent_position_bounds: [[42.1, 55.9], [70.1, 83.9]]
      target_position_bounds: [[182.1, 195.9], [182.1, 195.9]]

  - <<: *val_template
    name_prefix: val_template_s1
    regime: validation_template_s1
    seed_groups: {sampler: indexed, prefix: speedfull_val_template_s1, count: 8, width: 4}
    reset_constraints:
      target_room: opposite
      minimum_initial_distance: 36.0
      agent_position_bounds: [[42.1, 55.9], [140.1, 153.9]]
      target_position_bounds: [[182.1, 195.9], [182.1, 195.9]]

  - <<: *val_template
    name_prefix: val_template_s2
    regime: validation_template_s2
    seed_groups: {sampler: indexed, prefix: speedfull_val_template_s2, count: 8, width: 4}
    reset_constraints:
      target_room: same
      minimum_initial_distance: 36.0
      agent_position_bounds: [[168.1, 181.9], [70.1, 83.9]]
      target_position_bounds: [[182.1, 195.9], [182.1, 195.9]]

  - <<: *val_template
    name_prefix: val_template_s3
    regime: validation_template_s3
    seed_groups: {sampler: indexed, prefix: speedfull_val_template_s3, count: 8, width: 4}
    reset_constraints:
      target_room: same
      minimum_initial_distance: 36.0
      agent_position_bounds: [[168.1, 181.9], [140.1, 153.9]]
      target_position_bounds: [[182.1, 195.9], [182.1, 195.9]]
