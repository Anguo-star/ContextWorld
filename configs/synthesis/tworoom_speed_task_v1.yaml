schema_version: 1
experiment: tworoom_speed_task_v1
task: tworoom
env_id: swm/TwoRoom-v1
profile: task_matched_lossless_exact_speed_support
seed: 20260716
scenario_generation_seed: 20260716

stable_worldmodel:
  repo: ../stable-worldmodel
  expected_ref: 5864b74980f6ed328fd0045e777b3865962eff43

collection:
  staging_root: /tmp
  episodes_per_scenario: 1
  max_episode_steps: 100
  image_shape: [224, 224]
  num_envs: 1
  pixel_codec:
    format: png
    compress_level: 1
  policy:
    action_noise: 2.0
    action_repeat_prob: 0.05
  # Restore the original TwoRoom task semantics without modifying StableWM.
  # The predicate is speed-independent, so every reset-goal pair remains
  # identical across the full speed cross.
  reset_constraints:
    target_room: opposite
    exclude_wall_zone: true
    minimum_initial_distance: 40.0

original_dataset:
  path: ../../data/world_model/quentinll/lewm-tworooms/tworoom.h5

output:
  data_root: artifacts/synthesis/data/tworoom_speed_task_v1
  manifest: artifacts/synthesis/manifests/tworoom_speed_task_v1.jsonl
  report: artifacts/synthesis/reports/tworoom_speed_task_v1.json
  catalog: artifacts/synthesis/catalogs/tworoom_speed_task_v1.json

planning:
  estimated_lance_bytes_per_row: 6500

validation:
  scenario_validation_workers: 16
  numeric_atom_isolation:
    atom: agent_speed
    minimum_cross_split_gap: 0.08
  minimum_episode_start_oracle:
    minimum_rows: 2
    termination_radius: 16.0
    minimum_guaranteed_margin: 8.0
  speed_frame_skip_oracle:
    seed: 314159
    slow_speed: 3.0
    multiplier: 2
    cases:
      - state: [40.0, 40.0]
        target_state: [190.0, 190.0]
        action: [0.5, 0.25]
      - state: [70.0, 170.0]
        target_state: [190.0, 30.0]
        action: [-0.25, -0.5]
      - state: [50.0, 100.0]
        target_state: [190.0, 180.0]
        action: [0.5, -0.25]
  paired_seed_crossing:
    atom: agent_speed
    splits:
      train:
        minimum_seed_groups: 16
        minimum_factor_values: 32
        minimum_paired_resets_per_factor: 512
      val:
        minimum_seed_groups: 4
        minimum_factor_values: 8
        minimum_paired_resets_per_factor: 64
  reset_coverage:
    grid_size: 14
    splits:
      train:
        unique_reset_seeds: 512
        unique_start_states: 512
        unique_goal_states: 512
        start_grid_bins: 160
        goal_grid_bins: 160
        start_goal_grid_pairs: 480
        cross_room_fraction: 1.0
        left_to_right_resets: 200
        right_to_left_resets: 200
        minimum_initial_distance: 40.0
        initial_distance_p10: 80.0
      val:
        unique_reset_seeds: 64
        unique_start_states: 64
        unique_goal_states: 64
        start_grid_bins: 40
        goal_grid_bins: 40
        start_goal_grid_pairs: 60
        cross_room_fraction: 1.0
        left_to_right_resets: 20
        right_to_left_resets: 20
        minimum_initial_distance: 40.0
        initial_distance_p10: 70.0

# Sixteen deterministic reset blocks provide 512 independent train geometries.
# Every geometry is crossed with all 32 speeds, including the eight frozen E4
# values. Scenario balancing in the grouped loader makes each speed/block child
# equally weighted even when episode termination lengths differ.
scenario_sets:
  - name_prefix: speed_train
    split: train
    regime: train_task_matched
    atom: agent_speed
    minimum_gap: 0.08
    episodes_per_scenario: 32
    seed_groups:
      sampler: indexed
      prefix: tworoom_speed_task_v1_train_paired
      count: 16
      width: 4
    values:
      sampler: fixed
      values:
        - 2.6
        - 2.7
        - 2.8
        - 2.9
        - 3.1
        - 3.3
        - 3.5
        - 3.7
        - 3.8
        - 3.9
        - 4.1
        - 4.2
        - 4.4
        - 4.5
        - 4.7
        - 5.0
        - 5.1
        - 5.3
        - 5.5
        - 5.7
        - 5.9
        - 6.1
        - 6.2
        - 6.3
        - 6.6
        - 6.7
        - 6.8
        - 7.0
        - 7.2
        - 7.3
        - 7.8
        - 7.9

  - name_prefix: speed_dev
    split: val
    regime: validation_task_matched
    atom: agent_speed
    minimum_gap: 0.08
    episodes_per_scenario: 16
    seed_groups:
      sampler: indexed
      prefix: tworoom_speed_task_v1_dev_paired
      count: 4
      width: 4
    values:
      sampler: fixed
      values: [2.5, 3.2, 4.3, 4.6, 4.9, 5.4, 5.6, 5.8]
