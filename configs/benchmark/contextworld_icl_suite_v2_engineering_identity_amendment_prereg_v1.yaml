        - tests/test_cube_grasp_rule_h3_v4r1_public_recovery.py
  field_constraints:
    allowed:
      - runtime.contextworld.source_sha256_values_for_the_listed_paths
      - identity_sha256_values_for_the_listed_paths
      - identity_size_bytes_only_where_the_existing_identity_records_it
      - action_strength_maintenance_amendment_metadata_for_public_score_numeric_reconstruction_consistency
      - cube_adapter_contract_removal_of_redundant_non_geometry_flags
      - shared_package_lazy_import_wiring_for_optional_dependency_isolation
      - >-
        wheel_and_sdist_metadata_limited_to_default_read_only_info_configs_and
        two_sha256_verified_immutable_public_aggregate_receipts
      - speed_runtime_supported_adapter_metadata_extension_from_lewm_to_lewm_and_pldm
    prohibited:
      - release_id_or_release_status
      - scope_history_action_geometry_or_future_horizon
      - data_paths_data_hashes_or_artifact_trees
      - scoring_metrics_scores_gates_or_thresholds
      - reference_results_or_formal_scoreboard
      - public_test_access_or_rerun_authorization
      - training_recipe_checkpoint_or_selection

membership_authority:
  config_alone_grants_membership: false
  activation_condition: passed_integrity_reseal_decision_v2
  required_reseal_id: contextworld_icl_suite_v2_integrity_reseal_v2
  integrity_reseal_v2_decision_must_bind:
    - this_amendment_preregistration
    - all_nine_current_component_release_configs
    - current_registered_suite_sources
  historical_chain_must_remain_byte_identical: true
  component_audits_must_pass_after_identity_update: true
  public_test_rerun_authorized: false
  training_or_checkpoint_selection_authorized: false
  formal_scoreboard_mutation_authorized: false
  raw_dataset_or_checkpoint_mutation_authorized: false
