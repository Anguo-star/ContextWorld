scoring:
  hidden_future_prediction:
    target: each_checkpoint_native_frozen_encoder
    public_primary: correct_future_rate
    cross_checkpoint_absolute_mse_comparison_allowed: false
    metrics:
      - correct_future_rate
      - correct_history_rate
      - context_switch_rate
      - worst_mass_correct_future_rate
    internal_anti_spoof_metrics:
      - latent_response.target_latent_separation.passed
      - latent_response.response_gain
      - latent_response.normalized_response_error
    anti_spoofing_contract:
      role: internal_validity_gate_not_public_primary_score
      normalization: within_checkpoint_real_target_response
      response_gain_anchors: {no_history_response: 0.0, real_response: 1.0}
      normalized_response_error_anchors: {real_response: 0.0, no_history_response: 1.0}
      legacy_results_require_checkpoint_rescore: true
    gates:
      correct_future_rate_minimum: 0.75
      correct_history_rate_minimum: 0.75
      context_switch_rate_minimum: 0.90
      worst_mass_correct_future_rate_minimum: 0.70
      target_latent_separation_required: true
      response_gain_minimum: 0.50
      normalized_response_error_strict_maximum: 1.00
    uncertainty:
      method: paired_query_bootstrap
      unit: mass_matched_query_pair
      resamples: 10000
      confidence_level: 0.95
      random_seed: 2026080204
      lower_bound_minimum:
        correct_future_rate: 0.70
        correct_history_rate: 0.70
        context_switch_rate: 0.85
  method_level:
    training_seeds_required: 3
    all_three_checkpoints_must_pass: true
  original_task_retention:
    evaluation: standard_reacher_cem
    episodes_per_checkpoint: 300
    eval_seeds: [42, 43, 44]
    episodes_per_eval_seed: 100
    noninferiority_margin_successes: 15
    gate: >-
      每个微调 checkpoint 的成功次数不得比其模型对应的原始 checkpoint
      少超过 15/300；原始与微调模型必须使用同一批 query。
    status: completed
    query_catalog_sha256: f139593c8b75eb5cd142d78223421e3e7b0a76a4ab086908afd9d9171dea9e27
    baseline_success_count: 164
    LeWM_success_counts: [163, 163, 160]
    success_deltas_from_baseline: [-1, -1, -4]
    checkpoints_passed: 3

