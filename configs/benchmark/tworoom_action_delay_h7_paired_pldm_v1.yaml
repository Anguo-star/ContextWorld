schema_version: 1
benchmark: tworoom_action_delay_history7_paired_pldm_v1
status: public_reference_training_stage
release_date: "2026-08-03"

question: >-
  在与 LeWM 完全相同的数据、初始化、预算和末步权重下，PLDM 训练目标能否让
  History=7 模型根据历史选择正确的真实下一状态？

stable_worldmodel:
  repo: ../stable-worldmodel
  commit: ad2bc44579f2b5b65c004fd2c9d8edc8ebaa43ce

data:
  original_read_only: upstream/lewm-tworooms/tworoom.h5
  original_split:
    strategy: episode_heldout
    seed: 3072
    train_fraction: 0.9
  frozen_normalizer:
    path: artifacts/splits/tworoom_original_train_s3072_normalizer.json
    sha256: a9e4b443bbac0d7a4e2d9d9f84d40ac40936556ffadfc7af0b0ce4fe4afed42c
    protocol: tworoom_original_train_s3072_unbiased_zscore_v1
    statistics_scope: original_9000_train_episodes_only
  formal_build_report:
    path: artifacts/synthesis/action_delay_h7_paired_v1/build_report.json
    sha256: 3de8b8f857c1fd2cd50eff06472069280237358ee7a8d647eb867bd647bdd628
  validation_exclusion_manifest:
    path: >-
      artifacts/evaluation/history7/action_delay_validation_v1/training_exclusion_manifest.json
    sha256: 5fb8322249c4a3d1445363359fad6f9ff3f356348e9f1941ea8da51adbf9b69b
    query_count: 300
  catalogs:
    action_delay_paired: >-
      artifacts/synthesis/action_delay_h7_paired_v1/catalogs/tworoom_action_delay_h7_paired_v1.json

data_quality:
  groups:
    action_delay_paired:
      require_complete_synthesis_report: true
      required_pixel_codec: {format: png, compress_level: 1, lossless: true}
      allowed_clip_start_raw_steps: [0]
      balance_by_factor: action.delay_steps
      exact_train_scenarios: 96
      exact_validation_scenarios: 18
      exact_test_scenarios: 0
      minimum_raw_train_clips: 15360
      minimum_train_scenarios: 96
      minimum_validation_scenarios: 18
      maximum_formal_mean_draws_per_raw_clip: 35.0
      factor_support_contract:
        factor: action.delay_steps
        expected_by_split:
          train: [0, 4, 8]
          validation: [0, 4, 8]
      required_catalog_sha256: 95f2aafea28c868852207d2174a59b8474c7ff17bcc57f65ec2f25339adc0486
      required_manifest_sha256: 2b39fc9aca7e9af651391ca6de0cad0fa6180253f8b152501b05409afba8213d
      required_synthesis_report_sha256: 1a86ec28b98a17de692bd6dba4ca2c77ea3b50f012fbebd9664d57c90ce00e40

training_protocol:
  architecture: stable_worldmodel_pldm_history7
  training_method: pldm
  history_tokens: 7
  num_preds: 1
  raw_steps_per_action_block: 5
  model_visible_fields: [pixels, action]
  training_profile: icl_formal
  initialization_checkpoint:
    path: artifacts/training/runs/checkpoints/h3_origheldout_s3072/weights_final_step_6420.pt
    sha256: 7d141b86cca49145444a69bff89c71ede69e8cf8252bfb933e656c3e2e962b54
    config_sha256: cd9ef9e2efde4527e36b6467d6a4efd120ab466d6a9f8a4aa41cdb7b56c4eddf
    role: model_weight_initialization_only_not_resume
    temporal_adaptation:
      parameter: predictor.pos_embedding
      strategy: linear_interpolation
      source_history_tokens: 3
      target_history_tokens: 7
      align_corners: true
      source_anchor_target_indices: [0, 3, 6]
  temporal_prediction_loss:
    mode: normalized_transition_weights
    transition_weights: [1, 1, 1, 1, 1, 1, 7]
    normalization: divide_by_sum_of_weights
    applies_to: all_training_groups
    note: >-
      七个转移全部训练；归一化后最后一个、也是 benchmark 直接检查的转移占
      7/13=53.85%，其余六个各占 1/13。
  paired_training_seeds: [3072, 4096, 5120]
  early_stopping: false
  checkpoint_selection: final_fixed_step
  distributed_execution:
    transport_configuration: framework_defaults
    primary_formal_launch: fresh
    resume_role: disaster_recovery_only
    resume_scope: complete_epoch_boundary_only
  group_sampling:
    H7_ActionDelay_Paired_PLDM:
      {original: 0.5, action_delay_paired: 0.5}
  budget:
    optimizer_steps: 1024
    effective_global_batch: 1024
    total_logical_draws: 1048576
    original_draws: 524288
    synthetic_draws: 524288
    mean_synthetic_draws_per_raw_clip: 34.13333333333333

models:
  - model_id: H7_ActionDelay_Paired_PLDM
    display_name: 成套多延迟数据与末步加权训练的 History=7 PLDM
    training_groups: [original, action_delay_paired]

stage_contract:
  role: coarse_delay_initialization_for_full_delay_refinement
  required_training_seeds: [3072, 4096, 5120]
  output_checkpoint: final_fixed_step_1024
  public_test_used_for_checkpoint_selection: false

execution:
  gpu_count: 8
  batch_size_per_device: 128
  gradient_accumulation_steps: 1
  effective_global_batch: 1024
  precision: bf16-mixed
  data_workers_per_rank: 6
  reference_runs_completed: true
