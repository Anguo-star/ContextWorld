      required_pixel_codec: {format: png, compress_level: 1, lossless: true}
      balance_by_factor: passage.open
      exact_train_scenarios: 96
      exact_validation_scenarios: 16
      exact_test_scenarios: 0
      exact_train_clips: 7680
      exact_validation_clips: 1280
      exact_test_clips: 0
      factor_support_contract:
        factor: passage.open
        expected_by_split:
          train: [1]
          validation: [1]
      minimum_raw_train_clips: 7680
      maximum_formal_mean_draws_per_raw_clip: 137.0
      minimum_train_scenarios: 96
      minimum_validation_scenarios: 16
      required_catalog_sha256: efeb6ab7775ec56c9b12021dcf2d378e0fa55fa65e58820e8434556f8f6c6cdd
      required_manifest_sha256: 249f955abd6dde28ed44ae14ecf9a5190fc2c4f224f00e324ce344dbbf0f0f4f
      required_synthesis_report_sha256: c63333a4e8aa816a50e93a2740fd3b02bb198c8cfa4107bd5dccc6c81e08593a
    passage_blocked:
      require_complete_synthesis_report: true
      required_pixel_codec: {format: png, compress_level: 1, lossless: true}
      balance_by_factor: passage.open
      exact_train_scenarios: 96
      exact_validation_scenarios: 16
      exact_test_scenarios: 0
      exact_train_clips: 7680
      exact_validation_clips: 1280
      exact_test_clips: 0
      factor_support_contract:
        factor: passage.open
        expected_by_split:
          train: [0]
          validation: [0]
      minimum_raw_train_clips: 7680
      maximum_formal_mean_draws_per_raw_clip: 137.0
      minimum_train_scenarios: 96
      minimum_validation_scenarios: 16
      required_catalog_sha256: b1c79c70b762711aad95dde9d65c65bbf2bad1efe02bb7bf7ee3d5e1375bb010
      required_manifest_sha256: 1bcaa18c1fedc5d1ca074abea21687984b61461d346f74270652ee902c178d75
      required_synthesis_report_sha256: 63e8c7f72be8c7cd17d4da2403a480af8532de1be9b4cdc430cae118a417fe8d
    passage_mixed:
      require_complete_synthesis_report: true
      required_pixel_codec: {format: png, compress_level: 1, lossless: true}
      balance_by_factor: passage.open
      exact_train_scenarios: 192
      exact_validation_scenarios: 32
      exact_test_scenarios: 0
      exact_train_clips: 15360
      exact_validation_clips: 2560
      exact_test_clips: 0
      factor_support_contract:
        factor: passage.open
        expected_by_split:
          train: [0, 1]
          validation: [0, 1]
      minimum_raw_train_clips: 15360
      maximum_formal_mean_draws_per_raw_clip: 69.0
      minimum_train_scenarios: 192
      minimum_validation_scenarios: 32
      required_catalog_sha256: 187915f7e2771df40e88dc5a3b9d44ac87c204967e1ac4e2632046ce7b41ecb2
      required_manifest_sha256: 14a82fce15d351c66d19d138d5463a91295574bb50bf2b0072de07a449489617
      required_synthesis_report_sha256: 1974969a5dc75a0f535e2941d5eb967324bf27b4bfea36202e2d6af5be55fb15

training_protocol:
  architecture: stable_worldmodel_lewm_history3
  history_tokens: 3
  raw_steps_per_action_block: 5
  model_visible_fields: [pixels, action]
  diagnostic_only_fields: [proprio]
  synthetic_only: true
  initialization_checkpoint:
    path: artifacts/training/runs/checkpoints/h3_origheldout_s3072/weights_final_step_6420.pt
    sha256: 7d141b86cca49145444a69bff89c71ede69e8cf8252bfb933e656c3e2e962b54
    config_sha256: cd9ef9e2efde4527e36b6467d6a4efd120ab466d6a9f8a4aa41cdb7b56c4eddf
    role: model_weight_initialization_only_not_resume
  normalizer_source: frozen_original_training_split_only
  frozen_model_modules: [encoder, projector]
  force_frozen_modules_eval_mode: true
  representation_contract:
    target_representation: original_h3_encoder_and_projector
    target_parameters_update: false
    target_running_statistics_update: false
    required_audit:
      - encoder_initial_and_final_state_sha256_equal
      - projector_initial_and_final_state_sha256_equal
      - both_modules_kept_in_eval_mode
  paired_training_seeds: [3072, 4096, 5120]
  early_stopping: false
  checkpoint_selection: final_fixed_step
  distributed_execution:
    strategy: ddp
    transport_configuration: framework_defaults_with_frozen_rendezvous_timeout
    rendezvous_timeout_seconds: 7200
    rendezvous_timeout_scope: passage_multi_gpu_only
    audit_scheduling:
      policy: sibling_shared_flock
      maximum_concurrency: 8
      scope: per_rank_full_audit_and_fit_start_storage_revalidation
      lock_protocol: contextworld.hidden_passage_h3.audit_scheduling_lock.v2
      lock_order: release_shared_then_audit_shared
      collective_holds_lock: false
      topology_scope: single_node_8gpu
      concurrent_training_runs_per_release: 1
    rank_cpu_affinity:
      policy: local_rank_disjoint_contiguous_from_zero
      cpus_per_rank: 8
      expected_world_size: 8
      scope: full_rank_process
      apply_before_stableworldmodel_and_lance_import: true
    training_run_exclusivity:
      protocol: contextworld.hidden_passage_h3.training_run_lock.v1
      policy: one_root_training_run_per_release
      maximum_concurrency: 1
      blocking: false
      scope: full_root_training_or_preflight_call
      held_through_report_snapshot: true
      nonzero_rank_admission: direct_parent_holds_root_training_lock
    primary_formal_launch: fresh
    resume_role: disaster_recovery_only
    resume_scope: complete_epoch_boundary_only
  group_sampling:
    H3_Passage_MixedRules_FrozenRepresentation: {passage_mixed: 1.0}
  fairness_contract:
    matched_previous_mixed_rule_recipe:
      - initialization_checkpoint_bytes
      - original_train_normalizer_bytes
      - synthetic_training_catalog_bytes
      - architecture_and_history_length
      - training_seeds
      - logical_optimizer_draws
      - optimizer_and_scheduler
    intentional_difference: encoder_and_projector_are_fixed
  profiles:
    passage_pilot:
      optimizer_steps: 256
      effective_global_batch: 1024
      total_logical_draws: 262144
    passage_formal:
      optimizer_steps: 1024
      effective_global_batch: 1024
      total_logical_draws: 1048576

models:
  - model_id: H3_Passage_MixedRules_FrozenRepresentation
    display_name: 固定原始图像表示的双规则模型
    training_groups: [passage_mixed]

evaluation_gate:
  stage_1_train_seen:
    required_training_seeds: [3072, 4096, 5120]
    all_three_must_pass: true
    per_model_per_true_future_per_history: 50x6
  stage_2_unseen_door_validation:
    locked_until_stage_1_passes: true
    required_training_seeds: [3072, 4096, 5120]
    all_three_must_pass: true
    per_model_per_true_future_per_history: 50x6

artifacts:
  training_root: artifacts/training/runs
  reports: artifacts/training/reports
  logs: artifacts/training/logs
  hash_freeze_gate: >-
    正式 build report 及三个 catalog、manifest、synthesis report 的 SHA-256
    已在训练前冻结；任一字节变化都会阻止 passage_formal 启动。
  frozen_inputs:
    validation_v2:
      - data.training_exclusion_manifest.path
      - data.training_exclusion_manifest.sha256
      - data.training_exclusion_manifest.content_sha256
    formal_training_data:
      - data.formal_build_report.sha256
      - data_quality.groups.passage_passable.required_catalog_sha256
      - data_quality.groups.passage_passable.required_manifest_sha256
      - data_quality.groups.passage_passable.required_synthesis_report_sha256
      - data_quality.groups.passage_blocked.required_catalog_sha256
      - data_quality.groups.passage_blocked.required_manifest_sha256
      - data_quality.groups.passage_blocked.required_synthesis_report_sha256
      - data_quality.groups.passage_mixed.required_catalog_sha256
      - data_quality.groups.passage_mixed.required_manifest_sha256
      - data_quality.groups.passage_mixed.required_synthesis_report_sha256
