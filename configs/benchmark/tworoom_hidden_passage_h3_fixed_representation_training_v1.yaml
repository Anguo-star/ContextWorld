schema_version: 1
benchmark: tworoom_hidden_passage_history3_fixed_representation_training_v1
status: formal_protocol_infrastructure_amended_before_gate_scoring
preregistered_date: "2026-07-24"
infrastructure_amendment:
  date: "2026-07-24"
  reason: >-
    单节点上存在无关的高负载作业，逐进程完整数据校核若强制串行会超过 DDP
    rendezvous 等待时间。改为同一训练根进程内最多 8 个只读校核并行。
  unchanged:
    - model_and_initialization
    - frozen_modules
    - training_and_validation_data_bytes
    - training_seeds
    - optimizer_and_scheduler
    - optimizer_steps_and_logical_draws
    - evaluation_catalogs_and_gates
  confirmation_policy: >-
    基础设施修订前产生的 checkpoint 不进入结论；三个训练种子全部在本修订下重跑。

question: >-
  固定原始 H3 的图像编码器与投影层、保持两种真实下一帧在 latent 中可分后，
  双规则合成训练能否让模型根据三帧历史选择正确的门通行结果？

stable_worldmodel:
  repo: ../stable-worldmodel
  commit: 5864b74980f6ed328fd0045e777b3865962eff43

data:
  # 原始 TwoRoom 只固定划分、归一化和初始化身份，不进入续训采样。
  original_read_only: artifacts/upstream/lewm-tworooms/tworoom.h5
  original_split:
    strategy: episode_heldout
    seed: 3072
    train_fraction: 0.9
    heldout_view: artifacts/splits/tworoom_original_episode_holdout_s3072.h5
    heldout_manifest: artifacts/splits/tworoom_original_episode_holdout_s3072.json
  frozen_normalizer:
    path: artifacts/splits/tworoom_original_train_s3072_normalizer.json
    sha256: a9e4b443bbac0d7a4e2d9d9f84d40ac40936556ffadfc7af0b0ce4fe4afed42c
    protocol: tworoom_original_train_s3072_unbiased_zscore_v1
    statistics_scope: original_9000_train_episodes_only
  training_exclusion_manifest:
    path: artifacts/evaluation/history3/hidden_passage_validation_v2/training_exclusion_manifest.json
    sha256: d732ca66061b7f16436d7897e570da3626957b1bda0a94ab0e7125d98f14eee9
    content_sha256: c23f079e6e9119fd4320d6209f992ca98b1d81a889c6127ade087a447c2aea0c
    query_count: 300
  formal_build_report:
    path: artifacts/synthesis/hidden_passage_h3_v1/formal/build_report.json
    sha256: f69a1c83664af800892c026836bf4a9cd0a0b0703cd9c23f4031e8d4d55efbbe
    benchmark: tworoom_hidden_passage_history3_training_data_v1
    scale: formal
  catalogs:
    passage_passable: artifacts/synthesis/hidden_passage_h3_v1/formal/catalogs/tworoom_hidden_passage_h3_passable_v1.json
    passage_blocked: artifacts/synthesis/hidden_passage_h3_v1/formal/catalogs/tworoom_hidden_passage_h3_blocked_v1.json
    passage_mixed: artifacts/synthesis/hidden_passage_h3_v1/formal/catalogs/tworoom_hidden_passage_h3_mixed_v1.json

passage_support:
  passage_passable:
    train: [1]
    validation: [1]
  passage_blocked:
    train: [0]
    validation: [0]
  passage_mixed:
    train: [0, 1]
    validation: [0, 1]
  eval_only_door_positions:
    [30, 34, 38, 42, 46, 50, 54, 58, 62, 66, 70, 74, 78, 82, 86,
     90, 94, 98, 102, 106, 110, 114, 118, 122, 126, 130, 134, 138,
     142, 146, 150, 154, 158, 162, 166, 170, 174, 178, 182, 186, 190,
     194]
  requirements:
    - training_and_loader_validation_exclude_every_eval_only_door_position
    - training_catalog_ood_test_is_empty
    - passable_and_blocked_shards_are_paired_by_split_and_pair_id
    - mixed_catalog_is_the_exact_union_of_both_single_rule_catalogs

paired_collection_contract:
  passage_rules:
    pair_identity: [split, pair_id]
    allowed_difference: passage.open
    passable_value: 1
    blocked_value: 0
    equal_manifest_fields:
      - split
      - regime
      - stable_worldmodel_commit
      - pixel_codec
      - seed_group
      - pair_id
    equal_manifest_count_fields:
      - episode_count
      - clip_count
      - rows_per_episode
      - raw_rows
    equal_episode_fields:
      - pair_id
      - direction
      - door_position
      - doorway_offset_px
      - action_sha256
      - initial_pixels_sha256
      - query_pixels_sha256
      - goal_pixels_sha256
      - model_input_keys
      - passed
    allowed_episode_differences:
      - rule
      - passage_open
      - middle_pixels_sha256
      - future_pixels_sha256
      - model_pixels_sha256
      - model_proprio_sha256
      - raw_pixels_sha256
      - raw_proprio_sha256
      - raw_state_sha256
      - raw_variation_passage_open_sha256

