claim_boundary:
  current: >-
    物理与数据审计、三种子训练和一次性 Public Test 已完成。配对真实未来训练的
    LeWM 将正确出口判断从基础模型的 50.20% 提高到三种子平均 83.92%，但 LeWM
    和 PLDM 均为 0/3 通过冻结门槛，不能声称传送门出口位置 ICL 已稳定解决。
    LeWM 的 latent 响应防伪门为 3/3 通过，但不能替代未通过的主预测门。
    三个 LeWM 的标准 TwoRoom CEM 成功次数为 276/300、271/300 和 266/300，
    相对基础模型 273/300 分别变化 +3、-2 和 -7，3/3 通过原任务保持要求。
  does_not_prove:
    - 已学会任意传送门数量或任意出口数量
    - 已完成多步传送规划
    - 已完成传送门出口与其他隐藏规则的组合 ICL

