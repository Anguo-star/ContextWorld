schema_version: 1
aggregate_id: contextworld_pldm_reference_completion_aggregate_results_freeze_v1
status: preregistered_pending_four_final_outcomes
release_id: contextworld_icl_benchmark_suite_v2
created_utc: "2026-08-17"

# This record defines a final, additive accounting step.  It neither selects
# checkpoints nor changes any historical Suite v2 result.  Speed and
# ActionStrength always need their three-seed Public ICL result.  That immutable
# ICL aggregate is frozen before any CEM run: a 3/3 pass records that CEM is
# authorized but not yet executed, then requires two separately frozen CEM
# tracks.  A non-pass instead records CEM as neither authorized nor executed
# and requires a frozen stop receipt.  Either Public ICL outcome is a formal
# trained-reference row.  The two Development-only failures are retained in
# the aggregate as negative evidence and never create a public-scoreboard row.
scope:
  components_in_final_aggregate:
    [speed, action_strength, contact_friction, motion_damping]
  public_scoreboard_components: [speed, action_strength]
  development_only_components: [contact_friction, motion_damping]
  formal_public_result_required_for_scoreboard_row: true
  public_result_added_regardless_of_pass_or_fail: true
  public_icl_three_seed_result_required_for_every_formal_component: true
  cem_required_only_after_three_seed_public_icl_pass: true
  nonpassing_public_icl_requires_cem_not_authorized_proof: true
  development_only_result_must_not_add_public_row: true
  training_or_checkpoint_selection_authorized: false
  raw_dataset_mutation_authorized: false
  public_test_rerun_authorized: false

