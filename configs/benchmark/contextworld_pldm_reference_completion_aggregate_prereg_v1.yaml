formal_evidence_contract:
  public_icl_aggregate_schema_version: 1
  required_training_seeds: 3
  public_icl_requirements:
    - bind_current_completion_and_release_config_identities
    - bind_passed_prepublic_development_config_manifest_and_three_seed_receipts
    - bind_three_independent_recovery_receipts_and_raw_public_results
    - prove_float32_or_equivalent_independent_rescore_and_exact_gate_recovery
    - make_pass_fail_outcome_consistent_with_three_icl_gates
    - retain_behavioral_evidence_scope_when_no_paired_training_control_exists
  if_all_three_public_icl_gates_pass:
    - public_icl_aggregate_records_cem_authorized_true_and_executed_false
    - each_later_speed_cem_aggregate_rebinds_the_same_prepublic_development_chain
    - bind_three_action_planning_cem_results
    - bind_three_original_task_retention_cem_results
    - derive_cem_completed_only_from_the_two_later_cem_aggregates
  if_any_public_icl_gate_fails:
    - bind_cem_not_authorized_stop_receipt
    - speed_cem_stop_rebinds_the_same_prepublic_development_chain
    - require_cem_authorized_false_and_cem_executed_false
    - retention_result_is_not_evaluated

