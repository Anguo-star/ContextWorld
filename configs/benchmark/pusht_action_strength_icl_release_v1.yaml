claim_boundary:
  current_claim: >-
    数据与因果配对已经审计；三个参考 LeWM checkpoint 同时通过四项预测门、
    latent 响应防伪门、动作区域选择和标准 PushT CEM 非劣门。
  historical_evidence: >-
    latent 响应防伪门加入前，三个 checkpoint 已通过四项排序指标、动作区域选择
    和标准 PushT CEM 非劣门；新评分确认该结果并非只靠正确排序获得。
  does_not_prove:
    - 所有模型都能学会推手移动幅度 ICL
    - 能外推到训练范围外的连续推手移动幅度
    - 已学会摩擦、质量或其他隐藏动力学
    - 动作振幅已经精确到连续最优值

