# This declaration fixes the two *conditional* CEM protocols before the
# three-seed Public-ICL outcome is known.  It does not authorize a planner,
# open Public ICL data, select a checkpoint, or create an output.  A passed
# 3/3 Public-ICL recovery aggregate is still required before the separate
# CEM-binding freezer can record concrete input identities and authorize jobs.
