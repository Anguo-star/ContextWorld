claim_boundary:
  proves: >-
    在冻结的 History=7 和延迟 0 至 10 条件下，先学明显延迟、再学习完整
    延迟范围的 PLDM 能根据历史选择正确的一步真实物理未来，并保留原始
    TwoRoom CEM 规划能力。
  does_not_prove:
    - h2 或 h3 多步自回归已通过
    - 未见延迟数值外推
    - 隐藏动作延迟下的闭环 CEM 规划
    - 所有世界模型训练目标都能学会该能力

