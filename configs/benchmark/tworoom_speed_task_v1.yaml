schema_version: 1
benchmark: tworoom_speed_task_v1
status: complete_no_planning_icl_improvement

data:
  original_read_only: ../../data/world_model/quentinll/lewm-tworooms/tworoom.h5
  catalogs:
    speed: artifacts/synthesis/catalogs/tworoom_speed_task_v1.json

data_quality:
  groups:
    speed:
      required_pixel_codec: {format: png, compress_level: 1, lossless: true}
      minimum_raw_train_clips: 1000000
      maximum_formal_mean_draws_per_raw_clip: 5.0
      minimum_train_scenarios: 512
      minimum_validation_scenarios: 32

training_protocol:
  comparison: task_distribution_and_trajectory_composition_vs_speedseen
  reference: H3-SpeedSeen-s3072
  early_stopping: false
  checkpoint_selection: final_fixed_step
  fixed_components:
    - exact_e4_speed_support
    - expert_policy_parameters
    - lossless_png_codec
    - original_synthetic_50_50_mixture
    - history3_lewm_architecture
    - optimizer_and_6420_step_budget
  changed_components:
    - all_synthetic_targets_are_opposite_room
    - independent_train_geometries_increase_from_128_to_512
    - reset_geometry_is_fully_crossed_with_all_32_speeds
  group_sampling:
    M_speed: {original: 0.50, speed: 0.50}

models:
  - model_id: M_speed
    display_name: H3-SpeedTask
    training_groups: [original, speed]
    checkpoint: artifacts/training/runs/checkpoints/h3_speedtask_s3072/weights_final_step_6420.pt

evaluation_plan:
  prediction_gate: E1 paired prediction on the frozen E4 catalog
  original_id_retention: 50x6
  paired_planning: E4 correct/wrong 50x6 with room-relation and template strata
  decision_rule: improvement over H3-SpeedSeen isolates the joint task-distribution and effective-geometry data-quality repair under a fixed model/training recipe

