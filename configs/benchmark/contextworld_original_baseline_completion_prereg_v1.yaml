schema_version: 1
preregistration_id: contextworld_original_baseline_completion_v1
status: frozen_before_new_baseline_scoring
frozen_date_utc: "2026-08-17"

purpose: >-
  Complete a descriptive LeWM/PLDM original-checkpoint ICL baseline matrix for
  the nine released ContextWorld capability components. The eight checkpoints
  were trained only on their original environment data and were fixed before
  this matrix was specified. This protocol performs no training and no model,
  recipe, or checkpoint selection.

scientific_status:
  registration_kind: post_release_descriptive_baseline_completion
  blind_preregistration_claimed: false
  reason_not_blind: prior reference and legacy baseline results already exist
  fixed_checkpoint_selection_independent_of_new_scores: true
  single_checkpoint_per_environment_and_family: true
  trained_contextworld_methods_remain_three_seed_methods: true
  cross_task_average_or_suite_total_authorized: false

authority:
  training_authorized: false
  checkpoint_selection_authorized: false
  formal_reference_rerun: false
  formal_scoreboard_mutation: false
  post_release_descriptive_baseline_scoring: true
  existing_suite_v2_reference_rows_mutated: false
  existing_cube_public_recovery_namespace_reused: false
  output_scope: additive_original_baseline_matrix_v1_only

execution_policy:
  score_every_frozen_cell_once: true
  publish_passes_and_failures: true
  result_based_retry_or_checkpoint_swap: false
  public_test_used_for_training_or_selection: false
  records_required_for_independent_rescoring: true
  batch_size_may_change_only_for_memory_fit: true
  metric_query_threshold_or_adapter_change_after_first_score: false
  output_root: artifacts/evaluation/original_baseline_matrix_v1
  matrix_summary: artifacts/evaluation/original_baseline_matrix_v1/matrix_summary.json
  checkpoint_identity_receipt: >-
    artifacts/evaluation/original_baseline_matrix_v1/checkpoint_identity_audit.json

reuse_policy:
  new_icl_receipts_required_for_all_18_cells: true
  legacy_score_may_replace_new_receipt: false
  legacy_score_may_be_reported_as_context_only: true
  exact_reuse_requirements:
    - checkpoint_sha256
    - release_config_sha256
    - data_or_query_manifest_sha256
    - metric_identity
    - stable_worldmodel_commit
  note: >-
    Legacy summaries that omit a checkpoint SHA, bind an older data manifest,
    or use a different primary metric are not promoted into this matrix.

action_delay_disclosure:
  release_history_tokens: 7
  canonical_tworoom_checkpoint_training_history_tokens: 3
  evaluation_adapter: frozen_history7_inference_from_h3_checkpoint
  adapter_behavior:
    sets_runtime_history_size_to_7: true
    enables_positional_interpolation: true
    changes_weights: false
    trains_or_finetunes: false
  allowed_claim: zero_shot_H7_inference_from_original_H3_checkpoint
  prohibited_claim: native_H7_original_checkpoint

cem_followup:
  authorized_by_this_preregistration: false
  uniform_environment_level_reuse_allowed: false
  component_specific_protocol_identity_required: true
  reason: >-
    CEM query catalogs, horizons, budgets, and Stable-WorldModel pins differ
    across capability releases even when the same original checkpoint is used.
    CEM completion therefore requires a separate component-bound protocol and
    cannot be collapsed into four environment-level numbers.

