completion_rule: >-
  ICL baseline completion requires one immutable receipt for every one of the
  18 frozen cells, including failed gates. It does not require any checkpoint
  to pass, does not authorize a trained-method claim from one checkpoint, and
  does not change the formal Suite v2 reference scoreboard.
