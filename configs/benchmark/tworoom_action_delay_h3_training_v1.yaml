schema_version: 1
benchmark: tworoom_action_delay_history3_training_v1
status: preregistered_before_model_training
preregistered_date: "2026-07-26"

question: >-
  与数据量、几何、动作和训练预算都相同的单延迟对照相比，包含延迟 0、2、4 的
  多延迟训练能否使 History=3 LeWM 根据近期动作效果适应当前响应延迟？

stable_worldmodel:
  repo: ../stable-worldmodel
  commit: 5864b74980f6ed328fd0045e777b3865962eff43

data:
  original_read_only: ../../data/world_model/quentinll/lewm-tworooms/tworoom.h5
  original_split:
    strategy: episode_heldout
    seed: 3072
    train_fraction: 0.9
  frozen_normalizer:
    path: artifacts/splits/tworoom_original_train_s3072_normalizer.json
    sha256: 7a5be7ea867bced446c1671b0b2c0ff6450ffc61e1a7bdbbfc5eaa0942f635db
    protocol: tworoom_original_train_s3072_unbiased_zscore_v1
    statistics_scope: original_9000_train_episodes_only
  formal_build_report:
    path: artifacts/synthesis/action_delay_h3_v1/build_report.json
    sha256: 50ed167fd21e1c8bf5eb03fe8f1d06195cdc9f10702209d39da758d6f0212ac7
  validation_exclusion_manifest:
    path: >-
      artifacts/evaluation/history3/action_delay_validation_v1/training_exclusion_manifest.json
    sha256: aff8a49d86ccf9661751a6c4f294504d8a0c2893a97dd3b32cb60c7928a1e6e7
    query_count: 300
  catalogs:
    action_delay_single: >-
      artifacts/synthesis/action_delay_h3_v1/catalogs/tworoom_action_delay_h3_single_v1.json
    action_delay_multi: >-
      artifacts/synthesis/action_delay_h3_v1/catalogs/tworoom_action_delay_h3_multi_v1.json

delay_support:
  action_delay_single:
    train: [2]
    validation: [2]
  action_delay_multi:
    train: [0, 2, 4]
    validation: [0, 2, 4]
  formal_eval:
    training_seen: [0, 2, 4]
    interpolation: [1, 3]

data_quality:
  groups:
    action_delay_single:
      require_complete_synthesis_report: true
      required_pixel_codec: {format: png, compress_level: 1, lossless: true}
      balance_by_factor: action.delay_steps
      exact_train_scenarios: 96
      exact_validation_scenarios: 18
      exact_test_scenarios: 0
      minimum_raw_train_clips: 15360
      minimum_train_scenarios: 96
      minimum_validation_scenarios: 18
      maximum_formal_mean_draws_per_raw_clip: 35.0
      factor_support_contract:
        factor: action.delay_steps
        expected_by_split:
          train: [2]
          validation: [2]
      required_catalog_sha256: 7fbf8b4e2896e57a4205627620cf0563d548a698127d84f4710d0ff4292e1e1e
      required_manifest_sha256: c7e642f818ca1d212c9107b4b7d4fdb21f1a71c77310a8b5cd8e7c12c1bb6e9b
      required_synthesis_report_sha256: e2a4ca735dbe35d1fdce58c9e1080e1680299380f8b48f3770f7fb692aa617f1
    action_delay_multi:
      require_complete_synthesis_report: true
      required_pixel_codec: {format: png, compress_level: 1, lossless: true}
      balance_by_factor: action.delay_steps
      exact_train_scenarios: 96
      exact_validation_scenarios: 18
      exact_test_scenarios: 0
      minimum_raw_train_clips: 15360
      minimum_train_scenarios: 96
      minimum_validation_scenarios: 18
      maximum_formal_mean_draws_per_raw_clip: 35.0
      factor_support_contract:
        factor: action.delay_steps
        expected_by_split:
          train: [0, 2, 4]
          validation: [0, 2, 4]
      required_catalog_sha256: c85763c2f49ea4842ec09c4b2c07e1802a8fc6b3f8a7b353b00ceb70a4fc6a6c
      required_manifest_sha256: 089c720aae20f6fe4bed3c42767c3be72d2c9c557ae7c2aa52bda34f54a8a04d
      required_synthesis_report_sha256: 746e7f4c1beca2e41eaffda1b070de254291bc0186e49d25f61a9456c881be02

training_protocol:
  architecture: stable_worldmodel_lewm_history3
  training_method: lewm
  history_tokens: 3
  raw_steps_per_action_block: 5
  model_visible_fields: [pixels, action]
  training_profile: icl_formal
  initialization_checkpoint:
    path: artifacts/training/runs/checkpoints/h3_origheldout_s3072/weights_final_step_6420.pt
    sha256: 7d141b86cca49145444a69bff89c71ede69e8cf8252bfb933e656c3e2e962b54
    config_sha256: 44b5bde83fbc91634ef84acbdba9a75d3436568ed72266c9a5aa057653f9162b
    role: model_weight_initialization_only_not_resume
  paired_training_seeds: [3072, 4096, 5120]
  early_stopping: false
  checkpoint_selection: final_fixed_step
  distributed_execution:
    transport_configuration: framework_defaults
    primary_formal_launch: fresh
    resume_role: disaster_recovery_only
    resume_scope: complete_epoch_boundary_only
  group_sampling:
    H3_ActionDelay_SingleControl:
      {original: 0.5, action_delay_single: 0.5}
    H3_ActionDelay_Multi:
      {original: 0.5, action_delay_multi: 0.5}
  budget:
    optimizer_steps: 1024
    effective_global_batch: 1024
    total_logical_draws: 1048576
    original_draws: 524288
    synthetic_draws: 524288
  fairness_contract:
    equal_across_models:
      - initialization_checkpoint_bytes
      - original_train_normalizer_bytes
      - original_and_synthetic_50_50_sampling
      - paired_synthetic_geometry_and_actions
      - synthetic_clip_count
      - architecture_and_history_length
      - optimizer_scheduler_and_step_budget
      - paired_training_seed
    intentional_difference: synthetic_action_delay_support_only

models:
  - model_id: H3_ActionDelay_SingleControl
    display_name: 原始数据加单延迟合成数据（延迟 2）对照
    training_groups: [original, action_delay_single]
  - model_id: H3_ActionDelay_Multi
    display_name: 原始数据加多延迟合成数据（延迟 0、2、4）
    training_groups: [original, action_delay_multi]

comparison:
  unchanged_baseline:
    model_id: H3_Original_LEWM
    checkpoint: artifacts/training/runs/checkpoints/h3_origheldout_s3072/weights_final_step_6420.pt
  required_training_matrix:
    H3_ActionDelay_SingleControl: [3072, 4096, 5120]
    H3_ActionDelay_Multi: [3072, 4096, 5120]
