    path: >-
      /tmp/contextworld_cube_gripper_carry_h3_v3_to_v4_exploratory_diagnostic_20260812.json
    sha256: f5f5064d96107e70e13ec3e623ecbe644eaf36554d7bf2075c0714064e78f306
    reused_old_v3_training_and_development: true
    public_test_opened_read_hashed_or_scored: false
    reference_model_training_or_scoring: false
    cannot_validate_v4: true
    design_decisions:
      signed_delta_feature_rejected: true
      absolute_delta_feature_rejected: true
      resolution_32x32_rejected: true
      roi_or_crop_feature_rejected: true
      frozen_v3_probe_retained: true
    isolation_rule: >-
      Every old-v3 source episode and every old-v3 action, scene, pair, and
