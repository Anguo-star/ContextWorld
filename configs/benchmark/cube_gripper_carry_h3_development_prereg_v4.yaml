schema_version: 1
preregistration_id: contextworld_cube_gripper_carry_h3_development_v4
protocol_id: cube_gripper_carry_rule_history3_development_v4
status: preregistered_before_first_v4_build
date: "2026-08-12"
phase: development_only
claim_limit: >-
  This preregistration authorizes exactly one first-and-formal Cube v4
  Training/Development data build, its frozen action-support and causal
  audits, and exactly one frozen RGB-history probe. It does not authorize a
  v4 builder/Lance smoke, reference-model training or scoring, Public Test
  access, a release claim, or suite registration.

question: >-
  Does the sole 0.30 N to 0.40 N vertical-force-coupling change make the
  unchanged Cube History=3 causal history signal recoverable by the unchanged
  v3 RGB probe on a wholly new, prior-content-disjoint Training/Development
  population, without reading or scoring Public Test?

scientific_change:
  sole_change: can_hold_vertical_force_coupling_n
  v3_baseline_vertical_force_coupling_n: 0.30
  v4_vertical_force_coupling_n: 0.40
  capability_semantics_unchanged: true
  history3_causal_sequence_unchanged: true
  action_profiles_and_constraints_unchanged_except_new_seeds: true
  semantics_unchanged:
    - hidden_rule_changes_only_qfrc_applied_during_mj_step
    - gravity_compensation_and_force_direction
    - continuous_x0_x1_x2_x3_trajectory
    - no_state_installation_after_x0
    - same_query_state_and_pixels_across_modes
    - paired_actions_bitwise_equal
    - four_v3_action_anchor_families
    - constrained_profile_perturbation_distribution
    - train_and_loader_validation_pair_counts
    - source_filter_and_catalog_policy
    - jpeg_camera_and_schema
    - causal_and_action_support_thresholds
    - rgb_probe_feature_estimator_controls_and_thresholds
  prohibited_additional_changes:
    - signed_or_absolute_temporal_delta_features
    - 32x32_features
    - roi_or_crop_features
    - learned_feature_or_hyperparameter_search
    - changed_action_anchors_or_perturbation_range
    - changed_causal_or_probe_thresholds
  non_scientific_population_isolation:
    formal_catalog_index_offset: 1000000
    reason: >-
      Two pre-freeze real-MuJoCo regression pairs had already instantiated
      v4 train catalog indices 0 and 1. The four-aligned formal namespace
      prevents content reuse while leaving the anchor families, perturbation
      distribution, coefficient range, split seeds, pair counts, scene RNG,
      causal semantics, probe recipe, and thresholds unchanged.
    chosen_without_formal_or_probe_result: true

