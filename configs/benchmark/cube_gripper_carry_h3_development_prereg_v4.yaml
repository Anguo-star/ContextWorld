    source_scene_count: 16
    coupling_candidates_n: [0.30, 0.40, 0.45, 0.50]
    evaluated_pair_count: 64
    selected_unique_coupling_n: 0.40
    selection_basis_only:
      - physical_history_and_future_height_gap_amplitude
      - rendered_rgb_change_amplitude
      - unchanged_causal_integrity
      - smallest_conservative_strengthening_above_failed_v3
    selection_did_not_use:
      - classifier_or_probe_accuracy
      - reference_model_training_or_scoring
      - public_test
    unchanged_during_pilot:
      - v3_four_action_anchors
      - paired_x0
      - bitwise_equal_paired_actions
      - continuous_p_negative_p_p_trajectory
      - sum_p_zero_final_p_zero_and_displacement_moment_one
