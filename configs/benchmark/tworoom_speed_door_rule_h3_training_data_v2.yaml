schema_version: 2
benchmark: tworoom_hidden_passage_history3_speed_door_rule_training_data_v2
status: preregistered_before_formal_collection_or_training
date: "2026-07-28"

stable_worldmodel:
  repo: ../stable-worldmodel
  commit: 4b6f5d94693631ce64ed1f561dd0bc1d23ca38fa
  relevant_sources:
    - stable_worldmodel/envs/two_room/env.py
    - stable_worldmodel/spaces.py

protocol:
  task: speed_door_rule_composition_v2
  history_tokens: 3
  context_transitions: 2
  agent_speed: 5.0
  agent_speeds: [2.7, 4.3, 6.1, 7.7]
  door_rules:
    passable: 1
    blocked: 0
  door_number: 1
  frameskip: 5
  raw_steps_per_action_block: 5
  num_steps: 4
  rows_per_episode: 20
  clips_per_episode: 1
  probe_action:
    vertical_speed_evidence: 0.25
    horizontal_rule_evidence: 0.70
    horizontal_rule_steps: 2
  recovery_action:
    cancel_vertical_speed_evidence: true
    collision_projection_outward_steps: 1
    collision_projection_return_steps: 1
  query_action:
    horizontal_rule_steps: 5
    horizontal_value: 1.0
    vertical_speed_steps: 0
    vertical_value: 0.0
  model_visible_fields: [pixels, action]
  privileged_audit_fields:
    - agent.speed
    - passage.open
    - state
    - template_id

geometry:
  directions: [left_to_right, right_to_left]
  doorway_offsets_px: [13.25, 13.375, 13.5, 13.625, 13.75]
  wall_distances_px: [0.5, 1.5]
  wall_geometry:
    left_contact_x: 99.5
    right_contact_x: 124.5
    left_to_right_goal_x: 190.0
    right_to_left_goal_x: 34.0

catalog_seed: 20260728

