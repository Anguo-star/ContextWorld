schema_version: 1
benchmark: tworoom_action_delay_history7_pldm_root_cause_v1
status: preregistered_before_pldm_training
preregistered_date: "2026-07-29"

question: >-
  在训练数据、初始化、History=7 结构、采样比例和 1,024 步预算均不变时，
  仅把 LeWM 训练目标替换为原生 PLDM 训练目标，模型能否根据历史区分
  动作延迟 0、4、8？

claim_boundary:
  root_cause_diagnostic_only: true
  required_training_seeds: [3072]
  changes_formal_benchmark_result: false
  hidden_test_remains_sealed: true
  no_cem: true
  no_training_data_change: true

