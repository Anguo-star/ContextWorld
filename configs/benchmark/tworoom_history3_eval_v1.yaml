schema_version: 1
benchmark: contextworld_tworoom_history3_eval_v1
execution_repo: ContextWorld
stable_worldmodel_role: pinned_runtime_dependency

formal_planning_eval_protocol:
  num_eval_per_condition_per_seed: 50
  eval_seeds: [42, 43, 44, 45, 46, 47]
  total_eval_per_condition: 300
  aggregation: report_per_seed_then_equal_seed_mean_and_pooled_counts
  paired_conditions: reuse_identical_queries_goals_and_cem_subseeds
  scope: formal_cem_planning_only
  exceptions: [protocol_smoke, qualitative_probe, deterministic_prediction_catalog]

study_scope:
  stage: speed_first
  active_family: speed
  decision_rule: conclude_speed_before_enabling_other_families
  deferred_families: [door, speed_door_composition]

stage1_comparison_roster:
  - display_id: H3-Orig
    model_family: LeWM
    training_data: original_only
    role: within_family_negative_control
    status: e4_50x6_complete
  - display_id: DINO-Orig
    model_family: DINO-WM
    implementation: StableWM_PreJEPA
    training_data: original_only
    input_modalities: [pixels, action]
    history_size: 3
    action_block: 5
    role: external_family_negative_control
    status: checkpoint_and_adapter_pending
    required_adapter_guards:
      - infer_action_block_from_extra_encoders_action
      - clear_init_and_goal_cache_between_context_conditions
      - reproduce_dinowm_population_zscore_from_original_train_data
      - do_not_use_with_proprio_without_context_proprio_injection
  - display_id: H3-MixSpeed
    model_id: M_speed
    model_family: LeWM
    training_data: [original, speed]
    logical_group_weights: {original: 0.5, speed: 0.5}
    training_profile_ref: configs/benchmark/tworoom_step1_v1.yaml
    training_seed: 3072
    data_split_seed: 3072
    role: synthetic_training_positive_control
    checkpoint: artifacts/training/runs/checkpoints/h3_mixspeed_s3072/weights_final_step_6420.pt
    checkpoint_sha256: aab2a6f439e06f1a4bbba7189d29904b53c1e79c17d7956aabaca5413523d144
    status: e4_50x6_complete_no_positive_separation
  - display_id: H3-SpeedClean
    model_id: M_speedclean
    model_family: LeWM
    training_data: [original, speed_clean]
    logical_group_weights: {original: 0.5, speed_clean: 0.5}
    training_profile_ref: configs/benchmark/tworoom_step1_v1.yaml
    training_seed: 3072
    data_split_seed: 3072
    role: data_repair_positive_control
    checkpoint: artifacts/training/runs/checkpoints/h3_speedclean_s3072/weights_final_step_6420.pt
    checkpoint_sha256: 2d64cf5c9beeae6578529e9fa94538dfd9e937073e5114933b7db7025ba5b35c
    status: e1_id_e4_complete_no_planning_separation
  - display_id: H3-SpeedSeen
    model_id: M_speedseen
    model_family: LeWM
    training_data: [original, speed_seen]
    logical_group_weights: {original: 0.5, speed_seen: 0.5}
    training_profile_ref: configs/benchmark/tworoom_speed_seen_v1.yaml
    training_seed: 3072
    data_split_seed: 3072
    role: exact_speed_support_overlap_control
    evaluation_role: seen_speed_diagnostic_not_heldout_validation
    checkpoint: artifacts/training/runs/checkpoints/h3_speedseen_s3072/weights_final_step_6420.pt
    checkpoint_sha256: 17122ac75fbcd327a25eae121eab8fdddec7fb6c46cb5beb2a1fd7784a5c5161
    status: e1_id_e4_complete_success_unchanged_final_distance_improved
  - display_id: H3-SpeedTask
    model_id: M_speed
    model_family: LeWM
    training_data: [original, speed_task]
    logical_group_weights: {original: 0.5, speed_task: 0.5}
    training_profile_ref: configs/benchmark/tworoom_speed_task_v1.yaml
    training_seed: 3072
    data_split_seed: 3072
    role: task_distribution_and_effective_geometry_control
    data_status: generated_validated_preflight_passed
    checkpoint: artifacts/training/runs/checkpoints/h3_speedtask_s3072/weights_final_step_6420.pt
    checkpoint_sha256: 4bb6edfdf9d5c3868eb0aca2fc59b0716a2890cda9508806f0ed43b4094cb3fc
    status: e1_id_e4_complete_success_unchanged_final_distance_regressed

cross_model_interpretation:
  absolute_ood_success: task_difficulty_and_general_ood_robustness
  paired_correct_minus_wrong: within_model_context_adaptation
  lewm_dinowm_latent_losses_directly_comparable: false
  low_absolute_scores_alone_validate_icl_benchmark: false

model:
  model_id: M_orig
  class: jepa.JEPA
  checkpoint: /opt/huawei/explorer-env/dataset/ag_data/data/world_model/quentinll/lewm-tworooms/ckpt/tworoom_lewm_20260430/tworoom_lewm_20260430_epoch_10_object.ckpt
  legacy_code_root: /opt/huawei/explorer-env/dataset/ag_data/code/wm_exp
  original_h5: /opt/huawei/explorer-env/dataset/ag_data/data/world_model/quentinll/lewm-tworooms/tworoom.h5
  parameter_count: 18034478
  history_size: 3
  maximum_prior_context_transitions: 2
  action_block: 5
  image_size: 224
  training_seed: 3072
  prediction_seed: 3072

runtime:
  stable_worldmodel_repo: ../stable-worldmodel
  stable_worldmodel_commit: 5864b74980f6ed328fd0045e777b3865962eff43
  device: cuda:0
  output_dir: artifacts/evaluation/history3

evaluation_groups:
  speed_context_identifiability:
    display_name: Speed-ID oracle
    status: complete
    entrypoint: scripts/eval_tworoom_speed_identifiability.py
    catalog: artifacts/evaluation/icl/tworoom_icl_v1_validation_context_query_catalog.json
    output: artifacts/evaluation/history3/oracle_speed_identifiability_k2_k4_k8.json
    split: validation
    family: speed
    context_transitions: [2, 4, 8]
    matched_model_history_tokens: [3, 5, 9]
    unique_bundles: 32
    candidate_speeds: [3.1, 3.3, 3.5, 4.1, 5.0, 5.1, 5.9, 7.0]
    estimators:
      state_oracle: [privileged_state, model_visible_action]
      pixel_oracle: [model_visible_rgb, model_visible_action]
    result:
      state_accuracy_by_k: {2: 1.0, 4: 1.0, 8: 1.0}
      pixel_accuracy_by_k: {2: 1.0, 4: 1.0, 8: 1.0}
      pixel_speed_mae_by_k: {2: 0.003795921954143841, 4: 0.003795921954143841, 8: 0.003795921954143841}
      maximum_endpoint_error: 0.0
      maximum_collision_residual: 6.823937920013263e-06
      decision: k2_is_information_sufficient_history_length_not_primary_bottleneck
    interpretation: K4 and K8 repeat deterministic paired evidence while preserving the same query state; equal accuracy does not prove equal learning difficulty.

