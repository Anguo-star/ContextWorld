schema_version: 1
benchmark: pusht_hidden_actuation_history3_action_coverage_v2
experiment: group_balanced_sigreg_joint_retention_v1
status: registered_before_gradient_or_training
owner: ContextWorld

question: >-
  Can one SIGReg primitive, evaluated separately on the full representation
  marginal and on condition-matched pair differences, preserve both
  History-identifiable hidden dynamics and standard Push-T planning ability?

method:
  display_name_zh: 分组平衡 SIGReg
  implementation: stable_worldmodel.wm.loss.GroupBalancedSIGReg
  active_time_formula: >-
    0.5 * (SIGReg(full_batch_representation) +
    SIGReg(condition_matched_difference / sqrt(2)))
  inactive_time_formula: SIGReg(full_batch_representation)
  shared_random_projections_between_groups: true
  separately_computed_group_statistics: true
  group_scalar_weights:
    marginal: 0.5
    paired_difference: 0.5
  hidden_rule_or_class_label_consumed: false
  external_regularizer_weight_count: 1
  variance_covariance_or_invariance_terms_added: false

weight:
  external: 0.02
  effective_active_marginal: 0.01
  effective_active_paired_difference: 0.01
  rationale: >-
    The 0.02 external coefficient is derived before training so that equal
    group averaging retains the already validated 0.01 effective coefficient
    on the paired-difference branch. It is not selected by a new sweep.

immutable_inputs:
  hidden_data: artifacts/synthesis/pusht_hidden_actuation_h3_v1
  hidden_manifest_sha256: 4f307a60920747506c1d8aadc41931a0f768b7f3d7ba6317d7246b008bc3fc64
  original_data: external/pusht/lewm_pusht.lance
  action_normalizer_source: external/pusht/pusht_expert_train.h5
  source_checkpoint: external/pusht/pusht_lewm_baseline_seed3073_weights.ckpt
  source_checkpoint_sha256: 9f13b2c28bb909338047e08d62bf6eb16ea3616cb53e57cfa9b5072b43db1c59

gradient_screen:
  training_seed: 4097
  batch_size: 128
  original_samples: 64
  hidden_samples: 64
  hidden_pairs: 32
  active_times:
    - 1
    - 3
  random_projection_seed: 97031
  num_projections: 1024
  gates:
    total_descent_expands_probe_pair_distance: true
    total_descent_expands_history_conditioned_future_pair_distance: true
    marginal_branch_gradient_on_original_rows_at_active_times_nonzero: true
    paired_difference_branch_gradient_on_hidden_rows_at_active_times_nonzero: true
  stop_before_training_if_any_gate_fails: true

training:
  variant: mixed_group_balanced_sigreg_0p02
  seed: 4097
  seed_role: first_unseen_method_validation_seed
  optimizer_steps: 2048
  batch_size: 128
  original_samples_per_batch: 64
  hidden_samples_per_batch: 64
  hidden_pairs_per_batch: 32
  optimizer: AdamW
  learning_rate: 5.0e-5
  weight_decay: 1.0e-3
  gradient_clip_norm: 1.0
  precision: bf16_mixed
  conditional_active_times:
    - 1
    - 3

hidden_prediction_gate:
  target_selection_minimum: 0.95
  correct_history_minimum: 0.95
  rule_switch_minimum: 0.95
  worst_mode_minimum: 0.90

standard_pusht_followup:
  run_only_after_hidden_prediction_pass: true
  protocol: exact_standard_history3_cem_300x30_top30
  eval_seeds:
    - 42
    - 43
    - 44
    - 45
    - 46
    - 47
  queries_per_seed: 50
  replay_matched_native_0p09_control: 230/300
  noninferiority_margin_absolute: 0.05

hidden_actuation_followup:
  run_only_after_hidden_prediction_pass: true
  first_eval_seed: 5120
  query_pairs: 50
  oracle_grid_success_minimum: 0.95
  mode_action_classification_minimum: 0.90
  real_environment_success_minimum: 0.80

decision_rules:
  - >-
    Do not change the formula, group weights, external coefficient, training
    seed, or prediction thresholds after reading the gradient screen.
  - >-
    The gradient screen authorizes training only; it cannot establish
    representation learning or planning ability.
  - >-
    Run both real-environment CEM follow-ups for the final step-2048
    checkpoint if and only if all hidden-prediction thresholds pass.
  - >-
    A complete single-seed success requires hidden prediction, standard
    Push-T noninferiority, and hidden-actuation closed-loop success.
  - >-
    Even complete success remains a single unseen-seed validation until two
    additional training seeds are run without method changes.
