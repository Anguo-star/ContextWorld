schema_version: 2
benchmark: tworoom_hidden_passage_history3_validation_v2
status: preregistered_before_independent_catalog_generation_and_scoring
date: "2026-07-23"

source_protocol: configs/benchmark/tworoom_hidden_passage_h3_feasibility_v1.yaml

stable_worldmodel:
  repo: ../stable-worldmodel
  commit: 5864b74980f6ed328fd0045e777b3865962eff43

history3:
  history_tokens: 3
  raw_steps_per_action_block: 5
  query_future_blocks: 1
  true_future_rules: [passable, blocked]
  history_conditions:
    observed_passable: 看见智能体穿过门的历史
    observed_blocked: 看见智能体被门挡住的历史
    did_not_attempt_crossing: 没有尝试穿门的历史
  all_three_histories_use_identical_actions: true
  all_three_histories_end_at_identical_query: true
  no_crossing_attempt_is_continuous_environment_history: true

data:
  split: validation
  generation:
    catalog_seed: 20260723
    assignment_seed: 20260724
    # 42 个位置全部只属于 Eval。训练和 loader validation 必须排除整张列表。
    eval_only_door_positions: &eval_only_door_positions
      - 30
      - 34
      - 38
      - 42
      - 46
      - 50
      - 54
      - 58
      - 62
      - 66
      - 70
      - 74
      - 78
      - 82
      - 86
      - 90
      - 94
      - 98
      - 102
      - 106
      - 110
      - 114
      - 118
      - 122
      - 126
      - 130
      - 134
      - 138
      - 142
      - 146
      - 150
      - 154
      - 158
      - 162
      - 166
      - 170
      - 174
      - 178
      - 182
      - 186
      - 190
      - 194
    candidate_door_positions: *eval_only_door_positions
    doorway_offsets_px: [11.0, 12.0, 13.0, 14.0]
    directions: [left_to_right, right_to_left]
    candidate_templates: 336
    selected_unique_queries: 300
  training_exclusion:
    exclude_all_eval_only_door_positions: true
    exclude_selected_template_ids: true
    exclude_selected_query_pixel_hashes: true
    fail_closed_if_exclusion_manifest_is_missing: true

evaluation:
  eval_seeds: [42, 43, 44, 45, 46, 47]
  eval_seed_semantics: seeded_disjoint_without_replacement_query_sets
  unique_queries_per_seed: 50
  direction_counts_per_seed:
    left_to_right: 25
    right_to_left: 25
  unique_queries: 300
  matrix_cells: 6
  model_predictions_per_checkpoint: 900
  loss_records_per_checkpoint: 1800
  batch_size: 64
  environment_calls_during_scoring: 0

adapter:
  implementation: StableWorldModelLeWMAdapter
  normalizer: artifacts/splits/tworoom_original_train_s3072_normalizer.json
  normalizer_sha256: 7a5be7ea867bced446c1671b0b2c0ff6450ffc61e1a7bdbbfc5eaa0942f635db
  model_input_keys: [pixels, action]
  privileged_fields_forbidden:
    - passage.open
    - state
    - goal_state
    - door.position
    - template_id
    - true_future

metrics:
  primary: frozen_true_next_frame_native_latent_mse
  paired_effects:
    - other_rule_history_loss_minus_same_rule_history_loss
    - no_crossing_attempt_history_loss_minus_same_rule_history_loss
  direct_rule_readout:
    - matching_history_two_target_accuracy
    - matching_history_two_target_margin
  additional:
    - strict_win_rate
    - paired_symmetric_contrast
    - eval_seed_and_direction_sign_consistency
    - target_latent_separation
    - two_target_tie_rate
  no_crossing_attempt_role: auxiliary_baseline_not_sufficient_for_attribution
  unchanged_query_relative_loss:
    enabled: false
    reason: blocked_true_future_is_exactly_the_unchanged_query
  raw_latent_mse_cross_checkpoint_comparison_allowed: false

gates:
  minimum_middle_state_gap_px: 8.0
  minimum_future_state_gap_px: 20.0
  query_pixels_unique: 300
  each_eval_seed_has_unique_queries: 50
  each_eval_seed_direction_has_unique_queries: 25
  all_eval_seed_query_sets_mutually_disjoint: true
  each_eval_seed_controls_its_own_without_replacement_selection: true
  all_history_actions_identical: true
  all_history_queries_identical: true
  no_crossing_attempt_rule_invariant: true
  offline_true_futures_frozen_before_scoring: true
  loss_records_per_checkpoint: 1800
  model_predictions_per_checkpoint: 900
  minimum_same_history_two_target_accuracy_exclusive: 0.5
  require_target_accuracy_above_threshold_in_every_eval_seed_direction: true
  minimum_strict_win_rate_exclusive: 0.5
  minimum_target_pair_latent_mse_exclusive: 1.0e-12
  paired_bootstrap:
    unit: static_query_within_eval_seed_direction
    strata: eval_seed_x_direction
    method: percentile
    resamples: 10000
    confidence: 0.95
    seed: 20260725
    minimum_lower_bound_exclusive: 0.0
    required_metrics:
      - passable/same_vs_other_rule_history
      - passable/same_vs_no_crossing_attempt
      - blocked/same_vs_other_rule_history
      - blocked/same_vs_no_crossing_attempt
      - passable/matching_history_two_target_margin
      - blocked/matching_history_two_target_margin

comparison:
  required_results:
    H3_Original_LEWM: [3072]
    H3_Passage_PassableOnly: [3072, 4096, 5120]
    H3_Passage_BlockedOnly: [3072, 4096, 5120]
    H3_Passage_MixedRules: [3072, 4096, 5120]
  checkpoint_training_model_id:
    H3_Original_LEWM: M_origheldout
    H3_Passage_PassableOnly: H3_Passage_PassableOnly
    H3_Passage_BlockedOnly: H3_Passage_BlockedOnly
    H3_Passage_MixedRules: H3_Passage_MixedRules
  attribution_gate:
    mixed_rules_passed_training_seeds: 3
    original_baseline_must_fail: true
    each_single_rule_family_must_not_pass_all_three_seeds: true
  require_identical:
    - config_sha256
    - catalog_sha256
    - normalizer_sha256
    - stable_worldmodel_commit
    - adapter_protocol
  require_unique_checkpoint_per_result: true

training_provenance:
  original_baseline:
    training_report: artifacts/training/reports/h3_origheldout_s3072.json
    training_report_sha256: 2ce86b60585eee9f1e79c4cd540a277cc82b5efa69ac80982d4f99a76306bdea
    checkpoint_sha256: 7d141b86cca49145444a69bff89c71ede69e8cf8252bfb933e656c3e2e962b54
    checkpoint_config_sha256: 44b5bde83fbc91634ef84acbdba9a75d3436568ed72266c9a5aa057653f9162b
    checkpoint_model_id: M_origheldout
    profile: formal
    optimizer_steps: 6420
    total_logical_draws: 6574080
    group_weights: {original: 1.0}
    topology:
      world_size: 4
      devices: 4
      batch_size_per_device: 128
      accumulation_steps: 2
      execution_topology: 4gpu_x_b128_x_accum2
    initialization_checkpoint: none
  passage_formal:
    training_benchmark_config: configs/benchmark/tworoom_hidden_passage_h3_training_v1.yaml
    profile: passage_formal
    optimizer_steps: 1024
    total_logical_draws: 1048576
    effective_global_batch: 1024
    topology:
      world_size: 8
      devices: 8
      batch_size_per_device: 128
      accumulation_steps: 1
      execution_topology: 8gpu_x_b128_x_accum1
    synthetic_only: true
    required_frozen_training_artifacts:
      groups: [passage_passable, passage_blocked, passage_mixed]
      per_group: [catalog, manifest, synthesis_report]
      formal_build_report: required
    validation_exclusion_benchmark: tworoom_hidden_passage_history3_validation_v2
    initialization_checkpoint:
      sha256: 7d141b86cca49145444a69bff89c71ede69e8cf8252bfb933e656c3e2e962b54
      config_sha256: 44b5bde83fbc91634ef84acbdba9a75d3436568ed72266c9a5aa057653f9162b
      role: model_weight_initialization_only_not_resume

artifacts:
  output_root: artifacts/evaluation/history3/hidden_passage_validation_v2
  catalog: artifacts/evaluation/history3/hidden_passage_validation_v2/catalog.json
  training_exclusion_manifest: artifacts/evaluation/history3/hidden_passage_validation_v2/training_exclusion_manifest.json
