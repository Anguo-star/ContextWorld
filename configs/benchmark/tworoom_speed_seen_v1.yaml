  checkpoint_selection: final_fixed_step
  formal_e4_role: seen_speed_diagnostic_not_heldout_validation
  group_sampling:
    M_speed: {original: 0.50, speed: 0.50}

models:
  - model_id: M_speed
    display_name: H3-SpeedSeen
    training_groups: [original, speed]
    checkpoint: artifacts/training/runs/checkpoints/h3_speedseen_s3072/weights_final_step_6420.pt

evaluation_plan:
  prediction_gate: E1 paired prediction on the frozen E4 catalog
  original_id_retention: 50x6
  seen_speed_planning_diagnostic: E4 correct/wrong 50x6
  interpretation:
    both_conditions_improve_equally: exact support improves generic planning but not ICL
    correct_improves_more_than_wrong: exact support enables seen-speed context use
    neither_condition_improves: exact speed support is not the main bottleneck

