purpose: >-
  Complete original-task CEM evaluation for the three PLDM rows that already
  have frozen Public ICL results but were left unevaluated by the historical
  threshold-gated execution rule: PushT action strength, Reacher arm mass,
  and TwoRoom portal exit. This amendment changes execution coverage only.
  It does not change checkpoints, ICL scores, thresholds, or training recipes.

reason_for_amendment: >-
  The base complete-comparison freeze covered the five missing model rows but
  did not include the three existing PLDM rows whose CEM field was
  NOT_EVALUATED. No supplemental Public ICL or candidate CEM evaluation had
  started when this omission was found. The frozen base identity is preserved;
  this additive amendment supplies the omitted execution cells.

