  path: configs/benchmark/pusht_hidden_actuation_replay_matched_results_v2.yaml
  status: single_training_seed_mechanism_validation_complete

method_names:
  source:
    display_name_zh: 续训前原模型
    meaning: 不做任何续训，直接评测原始 PushT checkpoint
  native_sigreg:
    display_name_zh: 原始正则版
    meaning: 每个时间点都对整个 batch 的表示计算原始 SIGReg
  frozen_image_native:
    display_name_zh: 冻结图像编码器版
    meaning: 仅在隐藏数据上冻结 Encoder 和 Projector，只训练动力学模块
  frozen_planning_representation_mixed:
    display_name_zh: 固定规划表示的混合训练
    meaning: 在 50/50 混训中固定 Encoder 和 Projector，只更新动力学模块
  conditional_highpass:
    display_name_zh: 成对差异保护版
    meaning: 关键时间点只对相同 query 下两种隐藏动力学的表示差计算 SIGReg
  highpass_with_unpaired:
    display_name_zh: 差异保护兼顾原样本版
    meaning: 对成对表示差和未配对的标准 PushT 样本一起计算 SIGReg
  complete_haar:
    display_name_zh: 成对均值与差异完整版
    meaning: 同时保留每对样本的平均表示、差异表示和所有未配对样本
  group_balanced:
    display_name_zh: 分组平衡 SIGReg
    meaning: 对完整边缘总体和成对差异总体分别计算同一种 SIGReg，再等权合成一个标量
  dynamics_response:
    display_name_zh: 动力学响应 SIGReg
    meaning: >-
      在一次源尺度校准的 SIGReg 统计中联合标准 replay、真实条件响应和可辨识的
      确定性预测响应
  pldm:
    display_name_zh: PLDM 联合训练对照
    meaning: >-
      从同一 LeWM 源状态开始，使用官方 PLDM 的 std、std_t、cov 和 temporal
      alignment 活跃目标

