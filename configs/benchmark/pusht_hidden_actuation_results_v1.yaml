decision:
  jointly_passing_candidate: null
  information_and_retention_candidate: >-
    dynamics_response_sigreg_0p02_standard96_hidden32_step4096
  reason:
    - >-
      75/25 曝光匹配的动力学响应 SIGReg 已通过隐藏预测，标准 CEM 为 225/300，
      与 100% 标准 replay 续训完全相同；隐藏严格执行为 47%，仍低于 80% 门槛。
    - >-
      标准-only 续训为 225/300，50/50 默认 LeWM 为 194/300，50/50 响应模型为
      202/300。主要保持能力损失来自 replay 配比，而不是响应正则。
    - >-
      high-gain 的预测代价最小点与真实 latent 最小点几乎一致，但二者都落在物理
      失败区；剩余主因是控制目标度量，而不是规则、CEM 搜索或单独的 Projector。
    - >-
      PLDM 能在 4096 步学会隐藏规则并保持标准 PushT，但隐藏严格执行只有 29%，
      因而多成分防坍缩也不是第二层问题的完整修复。
    - >-
      当前训练 pair 在每个 query 只包含一个动作幅度，不能识别固定条件下的局部
      反事实 action-to-latent 曲线。
  rebuild_existing_paired_synthesis: false
  next_data_action: >-
    保留现有机制 pair，并增补同一 query 下的机制 × 邻近动作反事实网格。

conclusion:
  - >-
    TwoRoom Door 与 PushT 隐藏执行器增益共享同一条件信息失败类：默认 LeWM
    会选择性压缩只由 History 识别的局部动力学方向，边缘 SIGReg 不提供条件保证。
  - >-
    PLDM 在 PushT 上可以学会，但在相同 2048 步预算下慢于动力学响应 SIGReg；
    4096 步时达到 95% 正确目标、98% 正确历史、100% 规则切换和 94% 最差模式。
  - >-
    动力学响应 SIGReg 用一个权重和一次统计把 50/50 隐藏目标提升到 97%，且将同
    seed 标准 CEM 从 194/300 提升到 202/300；它不是标准能力下降的原因。
  - >-
    标准-only 续训与 75/25 曝光匹配响应模型都达到 225/300，后者同时达到 95%
    隐藏目标、95% 模式动作分类和 47% 严格执行。50/50 replay 替换是相对源模型
    下降的主要已识别来源，现有 paired synthesis 不需要重造。
  - >-
    当前方法缺少的是同一条件下的反事实动作邻域，而不是另一个防坍缩 loss 成分。
    下一步先多 seed 复现 75/25 联合结果，再对“隐藏机制 × 邻近动作”增量网格做一次
    正交响应 SIGReg，并保持单标量合同。
