decisions_frozen_before_control_execution:
  stable_fast_over_slow_gate:
    comparison: wrong_fast_minus_wrong_slow
    minimum_effect_pp: 5.0
    paired_exact_sign_test_p_max: 0.05
    require_fast_only_greater_than_slow_only: true
  integrated_recipe_attribution_support:
    target_model: M_speedfull
    control_models:
      - M_origheldout
      - M_synth5matched
      - M_origplus_synth5
    require_target_gate_passed: true
    require_every_control_gate_failed: true
    interpretation_if_passed: >-
      At this fixed training seed and integrated recipe level, multispeed
      training exposure is supported as the distinguishing factor for the
      stable planning-level speed-conditioned context effect.
    interpretation_if_any_control_passes: >-
      The planning-level Fast > Slow effect is not specific to SpeedFull and
      cannot be attributed to multispeed exposure from this matrix.
  secondary_not_frozen_gates:
    - target_minus_control_difference_in_context_effect
    - final_distance_and_normalized_progress
    - per_seed_and_per_geometry_direction_consistency
    - cem_replan_stage

