# Why this record exists
#
# The immediately preceding regeneration
# (``..._postpublication_regeneration_v1``) resealed the published decision
# against a documentation clarification, and its one-use authorization is
# spent.  That clarification contained a FALSE provenance statement: it said
# the eight original baseline checkpoints were LeWM's published baselines and
# that this repository does not train them.  They are in fact trained here,
# from LeWM's public datasets.  The error and its evidence are recorded in
# ``contextworld_icl_suite_v2_baseline_provenance_correction_v1``.
#
# So this regeneration is not another clarification.  It is the reseal that
# accompanies the withdrawal of a published false statement.  The distinction
# matters to anyone auditing the lineage: the predecessor regeneration is not
# merely superseded, it published something incorrect, and this record exists
# because of that.
#
# As with both predecessors, no successor v3 identity is created.  Nothing
# material changed -- no score, gate, verdict, dataset, checkpoint or
# scoreboard row moves.  A correction to a statement of fact about who trained
# the weights does not alter the evaluated material, so it does not warrant a
# seal generation.

