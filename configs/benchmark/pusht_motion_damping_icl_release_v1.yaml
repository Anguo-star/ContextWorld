  causal_chain:
    x0_requirement: >-
      The two conditions need not share the same x0 within one pair. Each x0
      is a real simulator state, and forward/reverse twins exchange the two x0
      images so that x0 alone predicts the hidden mode with 50% accuracy.
    transition_requirement: >-
      Every x0 -> x1 -> x2 -> x3 transition is produced by one continuous
      simulator trajectory. No state is installed and no simulator is rebuilt
      after x0.
    paired_query_requirement: >-
      At x2 the two trajectories have the same full 12-dimensional state,
      identical RGB, and the same query action, while their histories and real
      x3 futures differ.
    clean_replay_role: >-
      A fresh-simulator replay is audit-only. It confirms that invisible
      solver cache does not change x3 and is never used to build a target.
