schema_version: 1
export_id: contextworld_hf_clean_export_v1
status: staging_contract_not_release_authority
source_kind: suite_v2_copy_export_v2_benchmark_root
public_test_policy: withheld
copy_policy:
  regular_files_only: true
  symlinks_allowed: false
  hardlinks_created: false
  source_tree_modified: false

components:
  speed:
    dataset_id: tworoom-speed
    environment: TwoRoom
    capability_category: instantaneous_continuous_response
    description: Infer the agent's movement speed from recent visual and action history.
    history_length: 3
    action_dimension: 2
    frameskip: 5
    prediction_horizons_action_blocks: [1, 2, 3, 5]
    stable_worldmodel:
      sequence_schema: native_episode_sequence_v1
      required_columns: [episode_idx, step_idx, pixels, action, proprio]
      adapter_required: null
    release_config: configs/benchmark/tworoom_speed_icl_release_v1.yaml
    sources:
      - split: training
        source: synthesis/data/tworoom_speed_full_v1/train
        target: components/tworoom-speed/v1/training/data
      - split: development
        source: synthesis/data/tworoom_speed_full_v1/val
        target: components/tworoom-speed/v1/development/data

  door:
    dataset_id: tworoom-door
    environment: TwoRoom
    capability_category: hidden_structural_transition_rules
    description: Infer whether the hidden passage permits or blocks crossing.
    history_length: 3
    action_dimension: 2
    frameskip: 5
    prediction_horizons_action_blocks: [1]
    stable_worldmodel:
      sequence_schema: native_episode_sequence_v1
      required_columns: [episode_idx, step_idx, pixels, action, proprio]
      adapter_required: null
    release_config: configs/benchmark/tworoom_door_icl_release_v1.yaml
    sources:
      - split: training
        source: synthesis/hidden_passage_h3_v1/formal/tables/train
        target: components/tworoom-door/v1/training/data
      - split: development
        source: synthesis/hidden_passage_h3_v1/formal/tables/val
        target: components/tworoom-door/v1/development/data

  action_delay:
    dataset_id: tworoom-action-delay
    environment: TwoRoom
    capability_category: temporally_delayed_dynamics
    description: Infer how long actions are delayed before they affect motion.
    history_length: 7
    action_dimension: 2
    frameskip: 5
    prediction_horizons_action_blocks: [1]
    stable_worldmodel:
      sequence_schema: native_episode_sequence_v1
      required_columns: [episode_idx, step_idx, pixels, action, proprio]
      adapter_required: null
    release_config: configs/benchmark/tworoom_action_delay_icl_release_v1.yaml
    sources:
      - split: training
        source: synthesis/action_delay_h7_paired_v1/tables/train
        target: components/tworoom-action-delay/v1/training/coarse
      - split: development
        source: synthesis/action_delay_h7_paired_v1/tables/val
        target: components/tworoom-action-delay/v1/development/coarse
      - split: training
        source: synthesis/action_delay_h7_core_training_v3/tables/train
        target: components/tworoom-action-delay/v1/training/full
      - split: development
        source: synthesis/action_delay_h7_core_training_v3/tables/val
        target: components/tworoom-action-delay/v1/development/full

  action_strength:
    dataset_id: pusht-action-strength
    environment: PushT
    capability_category: instantaneous_continuous_response
    description: Infer how strongly commanded actions move the pusher.
    history_length: 3
    action_dimension: 2
    frameskip: 5
    prediction_horizons_action_blocks: [1]
    stable_worldmodel:
      sequence_schema: native_episode_sequence_with_step_metadata_v1
      required_columns: [episode_idx, step_idx, pixels, action, proprio]
      adapter_required: stablewm_step_metadata_to_episode_table_v1
    release_config: configs/benchmark/pusht_action_strength_icl_release_v1.yaml
    sources:
      - split: training
        source: synthesis/pusht_action_strength_h3_release_v1/train.lance
        target: components/pusht-action-strength/v1/training/data.lance
      - split: development
        source: synthesis/pusht_action_strength_h3_release_v1/validation.lance
        target: components/pusht-action-strength/v1/development/data.lance

  contact_friction:
    dataset_id: pusht-contact-friction
    environment: PushT
    capability_category: contact_or_attachment_conditioned_dynamics
    description: Infer the contact friction governing the pushed object's response.
    history_length: 3
    action_dimension: 2
    frameskip: 5
    prediction_horizons_action_blocks: [1]
    stable_worldmodel:
      sequence_schema: native_episode_sequence_with_step_metadata_v1
      required_columns: [episode_idx, step_idx, pixels, action, proprio]
      adapter_required: stablewm_step_metadata_to_episode_table_v1
    release_config: configs/benchmark/pusht_contact_friction_icl_release_v1.yaml
    sources:
      - split: training
        source: synthesis/pusht_contact_friction_h3_release_v3/train.lance
        target: components/pusht-contact-friction/v1/training/data.lance
      - split: development
        source: synthesis/pusht_contact_friction_h3_release_v3/loader_validation.lance
        target: components/pusht-contact-friction/v1/development/data.lance

  motion_damping:
    dataset_id: pusht-motion-damping
    environment: PushT
    capability_category: contact_or_attachment_conditioned_dynamics
    description: Infer how quickly object motion dissipates after interaction.
    history_length: 3
    action_dimension: 2
    frameskip: 5
    prediction_horizons_action_blocks: [1]
    stable_worldmodel:
      sequence_schema: native_episode_sequence_with_step_metadata_v1
      required_columns: [episode_idx, step_idx, pixels, action, proprio]
      adapter_required: stablewm_step_metadata_to_episode_table_v1
    release_config: configs/benchmark/pusht_motion_damping_icl_release_v1.yaml
    sources:
      - split: training
        source: synthesis/pusht_motion_damping_h3_release_v4/train.lance
        target: components/pusht-motion-damping/v1/training/data.lance
      - split: development
        source: synthesis/pusht_motion_damping_h3_release_v4/loader_validation.lance
        target: components/pusht-motion-damping/v1/development/data.lance

  robot_arm_mass:
    dataset_id: reacher-arm-mass
    environment: Reacher
    capability_category: instantaneous_continuous_response
    description: Infer how arm mass changes the Reacher's response to actions.
    history_length: 3
    action_dimension: 2
    frameskip: 5
    prediction_horizons_action_blocks: [1]
    stable_worldmodel:
      sequence_schema: native_episode_sequence_with_step_metadata_v1
      required_columns: [episode_idx, step_idx, pixels, action, proprio]
      adapter_required: stablewm_step_metadata_to_episode_table_v1
    release_config: configs/benchmark/reacher_arm_mass_icl_release_v1.yaml
    sources:
      - split: training
        source: synthesis/reacher_robot_arm_mass_h3_release_v1/train.lance
        target: components/reacher-arm-mass/v1/training/data.lance
      - split: development
        source: synthesis/reacher_robot_arm_mass_h3_release_v1/loader_validation.lance
        target: components/reacher-arm-mass/v1/development/data.lance

  portal_exit:
    dataset_id: tworoom-portal-exit
    environment: TwoRoom
    capability_category: hidden_structural_transition_rules
    description: Infer the hidden destination reached after entering the portal.
    history_length: 3
    action_dimension: 2
    frameskip: 5
    prediction_horizons_action_blocks: [1]
    stable_worldmodel:
      sequence_schema: native_episode_sequence_with_step_metadata_v1
      required_columns: [episode_idx, step_idx, pixels, action, proprio]
      adapter_required: stablewm_step_metadata_to_episode_table_v1
    release_config: configs/benchmark/tworoom_portal_exit_icl_release_v1.yaml
    sources:
      - split: training
        source: synthesis/tworoom_portal_exit_h3_release_v1/train.lance
        target: components/tworoom-portal-exit/v1/training/data.lance
      - split: development
        source: synthesis/tworoom_portal_exit_h3_release_v1/loader_validation.lance
        target: components/tworoom-portal-exit/v1/development/data.lance

  cube_gripper_carry:
    dataset_id: cube-gripper-carry
    environment: Cube
    capability_category: contact_or_attachment_conditioned_dynamics
    description: Infer whether a closed gripper carries the cube during motion.
    history_length: 3
    action_dimension: 5
    frameskip: 5
    prediction_horizons_action_blocks: [1]
    stable_worldmodel:
      sequence_schema: blocked_transition_projection_v1
      required_columns: [episode_idx, step_idx, pixels, action, proprio]
      adapter_required: cube_block_projection_to_sequence_v1
    release_config: configs/benchmark/cube_gripper_carry_h3_v4r1_icl_release_v1.yaml
    sources:
      - split: training
        source: synthesis/cube_gripper_carry_rule_h3_v4r1_release_projection_v1/train.lance
        target: components/cube-gripper-carry/v1/training/data.lance
      - split: development
        source: synthesis/cube_gripper_carry_rule_h3_v4r1_release_projection_v1/loader_validation.lance
        target: components/cube-gripper-carry/v1/development/data.lance
