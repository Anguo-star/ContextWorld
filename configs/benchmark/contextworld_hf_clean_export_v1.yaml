schema_version: 1
export_id: contextworld_hf_clean_export_v1
status: staging_contract_not_release_authority
source_kind: suite_v2_copy_export_v2_benchmark_root
public_test_policy: withheld
copy_policy:
  regular_files_only: true
  symlinks_allowed: false
  hardlinks_created: false
  source_tree_modified: false

components:
  speed:
    dataset_id: tworoom-speed
    environment: TwoRoom
    capability_category: instantaneous_continuous_response
    description: Infer the agent's movement speed from recent visual and action history.
    history_length: 3
    action_dimension: 2
    frameskip: 5
    prediction_horizons_action_blocks: [1, 2, 3, 5]
    stable_worldmodel:
      sequence_schema: native_episode_sequence_v1
      required_columns: [episode_idx, step_idx, pixels, action, proprio]
      adapter_required: null
    development_evaluation:
      schema_version: contextworld.development_evaluation.v1
      status: public_development_only
      split: development
      payload_id: data
      normalizer_path: normalizers/tworoom_original_train_s3072.json
      reader_id: tworoom_speed_history_utility_collection_v1
      comparison: context_history_vs_current_frame_only_ablation
      matched_counterfactual: false
      formal_public_score: false
      selection:
        unit: history_utility_case
        member_count: 96
        complete_windows_per_member: 3
        selected_case_count: 288
        method: lexicographic_first_complete_20_step_windows_v1
      input_contract:
        context_streams: [pixels, actions]
        history_length: 3
        action_block_raw_steps: 5
        prediction_horizon_action_blocks: 1
      action_normalization:
        transform: zscore
        source: original_tworoom_training_split
        mean: [0.0031402341986976924, -0.051594576296864605]
        std: [0.867571689163936, 0.8688840167517821]
        std_estimator: unbiased
    release_config: configs/benchmark/tworoom_speed_icl_release_v1.yaml
    sources:
      - split: training
        source: synthesis/data/tworoom_speed_full_v1/train
        target: components/tworoom-speed/v1/training/data
      - split: development
        source: synthesis/data/tworoom_speed_full_v1/val
        target: components/tworoom-speed/v1/development/data

