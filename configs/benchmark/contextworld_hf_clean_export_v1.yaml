      reader_id: tworoom_door_paired_rule_collection_v1
      selection:
        door_positions: 16
        complete_episodes_per_position: 18
        selected_pair_count: 288
        method: lexicographic_first_episode_ids_v1
      input_contract:
        context_streams: [pixels, actions]
        history_length: 3
        action_block_raw_steps: 5
        prediction_horizon_action_blocks: 1
      action_normalization:
        transform: zscore
