  scene_catalog_seed_by_split:
    train: 2026081101
    loader_validation: 2026081102
  action_profile_seed_by_split:
    train: 2026081101
    loader_validation: 2026081102

action_support:
  policy: shared_families_disjoint_profiles
  interpretation: >-
    The four anchor families are shared support strata, while every sampled
    concrete float32 action profile is unique within a split and disjoint
    between Training and Development. Development therefore measures unseen
    profiles inside the four frozen family neighborhoods, not unseen-family
    or unrestricted action generalization.
  feasibility_evidence:
    report: >-
      artifacts/evaluation/history3/cube_gripper_carry_h3_development_v3/action_template_feasibility_input.json
    sha256: 20dd1f7f629f569719886360c6ffca004a44df17e8632e55f7d37a1c400ed055
    narrative_report: >-
      artifacts/evaluation/history3/cube_gripper_carry_h3_development_v3/action_template_feasibility_input.md
    narrative_sha256: 1fda903a8f351b251b137483109d620b99157e8a3cefac9f2d3eccdde0c776e8
    scope: original_h5_plus_training_source_states_only
  original_h5_finite_action_rows: 2000000
  original_h5_joint_windows: 1860000
  v2_gripper_value: 1.0
  original_h5_gripper_maximum: 0.9075843095779419
  v3_gripper_values: [0.4, 0.5]
  per_profile_required:
    finite_five_axis_actions: true
    constraints_passed: true
    normalized_distance_from_anchor_reported: true
    conservative_nearest_original_h5_joint_15_step_nrmse_maximum: 0.5
    action_absolute_maximum: 1.0
    gripper_maximum: 0.9075843095779419
  aggregate_required:
    audited_profile_count: 2304
    train_profile_count: 2048
    loader_validation_profile_count: 256
    zero_failed_profiles: true

identifier_contract:
  action_anchor_id:
    role: shared_support_stratum
    cardinality: 4
    cross_split_overlap_expected: 4
  action_profile_id:
    role: concrete_float32_action_content_identity
    construction: sha256_of_actual_float32_action_blocks_without_split_or_ids
    unique_within_each_split: true
    cross_split_overlap_expected: 0
  pair_id:
    role: operational_split_specific_row_grouping_only
    content_disjointness_evidence: false
    cross_split_overlap_expected: 0
  scene_template_content_hash:
    role: canonical_scene_generation_input_identity
    construction: >-
      canonical hash of source row/episode/step, simulator seed, task id,
      qpos, control, cube color, and target position; excludes split,
      candidate IDs, anchor IDs, and action profile IDs
    cross_split_overlap_expected: 0
  pair_content_hash:
    role: canonical_scene_plus_action_content_identity
    construction: sha256_of_scene_template_content_hash_and_action_profile_id
    cross_split_overlap_expected: 0
  query_pixel_hash:
    role: rendered_query_content_identity
    cross_split_overlap_expected: 0
  rule: >-
    Split prefixes must never be used to disguise identical action or scene
    content as disjoint.
  canonicalization:
    action_dtype: little_endian_float32_on_this_frozen_builder
    action_shape: [4, 5, 5]
    byte_layout: contiguous_c_order
    metadata_included_in_hash: false

causal_gates:
  initial_pixels_bitwise_equal: true
  initial_complete_simulator_state_gap_maximum: 0.0
  history_cube_height_gap_m_minimum: 0.008
  history_changed_rgb_values_minimum: 100
  prequery_object_state_residual_maximum: 1.0e-12
  query_physical_state_gap_maximum: 1.0e-12
  query_complete_simulator_state_gap_maximum: 1.0e-12
  query_pixels_bitwise_equal: true
  actions_bitwise_equal_across_hidden_modes: true
  true_future_cube_height_gap_m_minimum: 0.008
  true_future_changed_rgb_values_minimum: 100
  deterministic_replay: true
  fresh_simulator_replay_required: true
  fresh_replay_complete_state_gap_maximum: 1.0e-12
  fresh_replay_pixels_bitwise_equal: true
  fresh_replay_actions_bitwise_equal: true
  zero_failed_saved_pairs: true

learnability_gates:
  rgb_history_probe:
    fit_split: train
    fit_display_name: Training
    evaluate_split_once: loader_validation
    evaluate_display_name: Development
    input: decoded_x0_x1_x2_rgb_only
    forbidden_inputs: [x3, action, physical_state, hidden_fields, ids, row_order]
    x3_pixel_bytes_read_allowed: false
    x3_metadata_and_action_read_for_content_audit_only: true
    decoder: Pillow_Image_open_convert_RGB
    channel_order: RGB
    resize:
      shape: [16, 16]
      interpolation: Pillow_Resampling_BILINEAR
    arithmetic_dtype: float64
    fixed_feature: "flatten(2*x1-x0-x2)_C_order"
    standard_scaler_fit_split_only: train
    estimator: StandardScaler_then_RidgeClassifier_alpha_1
    label_encoding: {cannot_hold: 0, can_hold: 1}
    decision_rule: sklearn_RidgeClassifier_predict
    overall_accuracy_minimum: 0.75
    worst_mode_accuracy_minimum: 0.70
    worst_anchor_family_accuracy_minimum: 0.70
    pair_cluster_bootstrap_lower_bound_minimum: 0.70
    bootstrap_unit: pair_cluster_stratified_by_anchor_family
    bootstrap_resamples: 10000
    bootstrap_seed: 2026081103
    negative_controls:
      label_permutation:
        repetitions: 16
        seed: 2026081104
        mean_accuracy_maximum: 0.60
      x0_only_accuracy_maximum: 0.51
      query_only_accuracy_maximum: 0.51
      action_only_accuracy_maximum: 0.51

reference_model_phase:
  training_and_scoring_authorized: false
  positive_reference_claim_authorized: false
  next_step_if_this_prereg_passes: >-
    Freeze a separate reference-training preregistration containing complete
    LeWM and PLDM recipes, seeds, runners, scorers, checkpoints, selection
    rules, and per-file identities before any optimizer step or model scoring.

public_test:
  canonical_split: validation
  display_name: Public Test
  access_status: closed_not_read_not_scored
  validation_lance_access_allowed: false
  generated_by_this_protocol: false
  used_for_data_or_action_design: false
  used_for_recipe_selection: false
  used_for_checkpoint_selection: false
  used_for_threshold_selection: false
  model_scoring_opened: false
  opening_condition: separate_release_freeze_after_passed_development
  on_development_failure: remain_closed_and_require_new_preregistration
  prohibition: >-
    Cube validation.lance/Public Test must not be opened, scanned, sampled,
    decoded, profiled, or used to derive statistics, hashes, features,
    thresholds, profiles, recipes, checkpoints, or claims.

decision_rules:
  on_data_or_probe_failure:
    - write_status_failed_development
    - record_failure_stage_as_data_contract_action_support_causal_or_rgb_probe
    - do_not_train_reference_models
    - keep_public_test_closed
  on_all_data_and_probe_gates_pass:
    - write_status_passed_development
    - record_scope_as_data_readiness_only
    - require_separate_reference_training_preregistration
    - keep_public_test_closed
  allowed_receipt_statuses: [passed_development, failed_development]
  passed_development_scope: data_readiness_only_not_reference_model_or_public

