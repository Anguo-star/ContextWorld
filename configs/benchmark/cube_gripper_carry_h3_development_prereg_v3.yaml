schema_version: 1
preregistration_id: contextworld_cube_gripper_carry_h3_development_v3
protocol_id: cube_gripper_carry_rule_history3_development_v3
status: amended_after_superseded_non_evidentiary_smoke_before_formal_build_or_model_scoring
date: "2026-08-11"
phase: development_only
claim_limit: >-
  This preregistration authorizes only the Cube v3 Training/Development data
  rebuild, action-support and causal audits, and the frozen RGB-history probe.
  It does not authorize reference-model training or scoring, Public Test
  access, a release claim, or suite registration.

amendment:
  amendment_id: source_cli_enforcement_v2
  reason: >-
    A read-only contract audit found that the preregistration required an
    explicit source path while the frozen builder still exposed a machine-
    local default, and that its source symbol was shorter than the normative
    source symbol. The smoke process completed before cancellation reached
    it, but the output is superseded and excluded from all evidence.
  detection_timing: during_first_smoke_before_final_result_inspection
  scientific_result_used_to_choose_amendment: false
  changed_fields_only:
    - builder_requires_explicit_source_cli_argument
    - builder_source_symbol_is_upstream_cube_single_expert_h5
    - freeze_receipt_advanced_to_v2_without_overwrite
  unchanged:
    - action_profiles_and_seeds
    - pair_counts_and_split_policy
    - causal_and_support_gates
    - rgb_probe_recipe_and_thresholds
    - public_test_closure
  superseded_preregistration:
    sha256: 4d2a52a88239c559bd706bb59d9c11e855efae41e847695fe04d5ef2c925c3b5
  superseded_freeze_receipt:
    path: >-
      artifacts/evaluation/history3/cube_gripper_carry_h3_development_v3/development_prereg_freeze_receipt.json
    sha256: d37a38af93760431cd2205229bcc362114ba38b4bf06603aeafccc3a28846773
  superseded_smoke:
    local_path_recorded_for_audit_only: >-
      /tmp/contextworld_cube_gripper_carry_h3_v3_smoke_32_8_20260811
    pair_counts: {train: 32, loader_validation: 8}
    tree_sha256: cc12bdc2cfbb88b7fad71468d24f7ffe88bd49e14a11f464c7d147ba7647befc
    request_sha256: d154b83c281311c595fff336b393ecaa7d936109dd116e8f1e23f8808dffd904
    build_report_sha256: 64e7a004f3a56ab2a9522cb16811ed49ddffdc6d31e4844125e8a816984834cf
    manifest_sha256: 58826e27801d4f391c1e59dbfb3fe898205f125286147440a49f89f8481d3ca4
    promoted_or_reused: false
    used_for_threshold_recipe_or_model_selection: false
    public_test_opened_or_generated: false
  next_evidentiary_build_requires_v2_receipt: true

question: >-
  Can four pair-balanced, family-shared but content-disjoint action-profile
  neighborhoods produce a strictly causal Cube History=3 Training/Development
  dataset whose hidden carry rule is recoverable from RGB history, without
  reading or scoring Public Test?

scope:
  environment: OGBench Cube single
  history_tokens: 3
  context_transitions: 2
  raw_steps_per_action_block: 5
  prediction_horizon_action_blocks: 1
  hidden_modes: [cannot_hold, can_hold]
  model_visible_fields: [pixels, action]
  privileged_fields_not_exposed_to_model:
    - hidden_grasp_enabled
    - hidden_mode
    - physical_state
    - complete_mujoco_state
    - pair_id
    - action_anchor_id
    - action_profile_id
    - catalog_index
    - source_row
    - source_episode
    - source_step
    - episode_idx
    - model_step_idx
    - split
    - scene_template_content_hash
    - pair_content_hash

