hypothesis:
  primary: >-
    Four balanced action families with split-disjoint constrained profile
    instances reduce joint action OOD and remove the single-sequence shortcut
    while preserving the same causal History=3 signal.
  not_primary:
    - Training_vs_Development_split_mismatch
    - original_replay_gradient_conflict
    - insufficient_LeWM_capacity_to_fit_any_cube_pairs
  training_risks_to_audit_after_data_passes:
    - paired_signal_is_small_relative_to_scene_variation
    - every_v2_LeWM_step_was_clipped_at_gradient_norm_1
    - PLDM_pair_conditional_response_collapse

protocol:
  continuous_sequence: [x0, probe_to_x1, recovery_to_x2, query_to_x3]
  state_installations_after_x0: 0
  query_simulator_recreated: false
  hidden_transition_input: mode_dependent_qfrc_applied_only
  action_layout:
    raw_action_dimension: 5
    z_sequence: "[p, -p, p]"
    unchanged_axes: [0, 1, 3]
    unchanged_axis_value: 0.0
    gripper_channel: 4
    action_anchor_families:
      endpoint4:
        p: [0.33333334, 0.0, 0.0, -0.33333334, 0.0]
        gripper: 0.4
        anchor_joint_15_step_nrmse: 0.2867
      plateau:
        p: [0.25, 0.25, -0.25, -0.25, 0.0]
        gripper: 0.4
        anchor_joint_15_step_nrmse: 0.2925
      ramp4:
        p: [0.3, 0.1, -0.1, -0.3, 0.0]
        gripper: 0.5
        anchor_joint_15_step_nrmse: 0.2914
      front_hold:
        p: [0.2, 0.2, 0.0, -0.4, 0.0]
        gripper: 0.5
        anchor_joint_15_step_nrmse: 0.2963
    perturbation:
      basis:
        - [1.0, 0.0, -3.0, 2.0, 0.0]
        - [0.0, 1.0, -2.0, 1.0, 0.0]
      normalize_each_basis: true
      coefficient_distribution: independent_uniform
      coefficient_range: [-0.02, 0.02]
      split_specific_deterministic_seeds:
        train: 2026081101
        loader_validation: 2026081102
      content_overlap_between_splits_allowed: false
    terminal_format_action_block:
      shape: [5, 5]
      value: all_zero_float32
      included_in_action_profile_content_hash: true
  profile_constraints:
    sum_p_target: 0.0
    final_p_target: 0.0
    displacement_moment_weights: [4.0, 3.0, 2.0, 1.0, 0.0]
    displacement_moment_target: 1.0
    absolute_tolerance: 1.0e-6

data_contract:
  artifact_root: >-
    artifacts/synthesis/cube_gripper_carry_rule_h3_development_v3
  authorized_splits:
    train:
      display_name: Training
      pair_count: 2048
      episode_count: 4096
      row_count: 16384
      pairs_per_anchor_family: 512
      lance_table: train.lance
    loader_validation:
      display_name: Development
      pair_count: 256
      episode_count: 512
      row_count: 2048
      pairs_per_anchor_family: 64
      lance_table: loader_validation.lance
  pair_count_must_be_divisible_by_anchor_count: true
  modes_per_pair: 2
  frames_per_mode: 4
  jpeg_quality: 95
  pixel_shape: [224, 224, 3]
  pixel_dtype: uint8_before_jpeg
  exact_anchor_balance_required_per_split: true
  exact_mode_balance_required_per_anchor: true
  actions_bitwise_equal_across_hidden_modes: true
  source_episode_overlap_between_splits_required: 0
  scene_template_content_hash_overlap_between_splits_required: 0
  pair_content_hash_overlap_between_splits_required: 0
  query_pixel_hash_overlap_between_splits_required: 0
  action_profile_content_hash_overlap_between_splits_required: 0

source_and_catalog:
  source_symbol: upstream_cube_single_expert_h5
  source_path_is_not_identity: true
