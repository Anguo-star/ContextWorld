schema_version: 1
preregistration_id: contextworld_complete_reference_comparison_v1
status: preregistered_before_supplemental_public_scoring
date: "2026-08-18"

purpose: >-
  Complete the reader-facing LeWM/PLDM comparison for every ContextWorld v1
  component. A model is evaluated on both ICL and original-task CEM even when
  it did not meet the component's Development threshold. Thresholds determine
  the reported verdict; they do not determine whether a frozen model is run.

authorization:
  source: explicit_user_instruction_2026_08_18
  public_scoring_authorized: true
  cem_scoring_authorized: true
  failed_models_must_remain_visible: true
  no_result_based_checkpoint_selection: true
  no_retraining_after_public_scores: true
  no_threshold_or_recipe_changes: true
  rerun_policy: infrastructure_failure_only_under_a_new_recovery_identity

claim_boundary:
  historical_scoreboard_rows_unchanged: true
  comparison_addendum_rows: 18
  comparison_addendum_is_a_formal_scoreboard_rewrite: false
  negative_results_are_reported: true
  contact_friction_and_motion_damping:
    comparator_kind: fixed_legacy_comparator
    comparison_only: true
    not_current_release_training_reference: true
    disclosure: >-
      These checkpoints were trained with the earlier 2,048-pair, 4,096-step
      recipe and are rescored on the current frozen Public Test. They provide
      a complete three-seed model comparison but are not evidence about the
      current 8,192-pair training recipe.
  cube_pldm:
    comparator_kind: frozen_current_v4r1_trained_checkpoint
    supplemental_public_result: true
    formal_reference_mutation: false
    formal_scoreboard_eligible: false

