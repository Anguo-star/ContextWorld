interpretation_boundaries:
  - CEM measures planning on the unmodified original environment task.
  - The same environment-level CEM value may be shown beside several components only as shared original-task context.
  - It does not measure which hidden ContextWorld rule was inferred.
  - TwoRoom CEM uses native History-3; it is not a native-History-7 ActionDelay result.
  - ContactFriction and MotionDamping Public Test remain closed and untouched.
  - Cube Public Test remains closed and untouched.
  - Historical PushT 237/300 and Reacher 164/300 are context only and are not reused because their receipts do not close all runtime/data identities.
