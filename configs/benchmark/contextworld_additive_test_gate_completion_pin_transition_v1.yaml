finding:
  classification: scoring_surface_extended_with_additive_gate_metrics
  additive_only: true
  new_thresholds_config: configs/benchmark/contextworld_test_gate_completion_v1.yaml
  explanation: '速度、动作延迟、门通行三个组件的 Public Test 评分器被就地扩展，补齐六项反捷径门槛（历史使用、上下文/规律切换率、最弱条件、latent 响应增益、归一化响应误差、paired
    bootstrap 95% 下界）。这些门槛此前只有其余六个组件具备。

    additive_only 的事实依据（逐项实测，不是声明）：

    1. 主分数：以 git archive 导出改动前源码树，在同一冻结环境 cwenv 中重跑受影响单元，改动前与改动后逐位相同（action_delay|lewm|3072 两者均为 0.9707407407407408；door|lewm|3073
    两者均为 0.995）。

    2. 既有门槛字段：只有 speed 在改动前已输出 gate_completion；其 4 条 track × 5 项指标共 20 个值改动前后逐位相同，零变化。

    3. 新增字段：action_delay 与 door 改动前的载荷完全不含 gate_completion / correct_history_rate / response_gain / latent_response，故新增内容不覆盖任何旧值。

    4. 冻结的 matching_history_strict_win_rate 诊断未被改动；动作延迟门槛所用的correct_history_rate 是新指标，按 physical_future_group
    排除物理上不可区分的延迟（h1 下 delays 5..10 同为静止），与 context_switch_rate 的 delay_pairs 同一条排除规则。不做此排除时该指标对任何模型的上限为
    6/11=0.5455，阈值 0.75 不可达。

    5. 全部封存结果已重跑：45 枚 Public Test + 45 枚 Development，逐枚校验划分身份、冻结数据 sha 与六项门槛齐全性。'
  separately_documented_finding: 重跑后 6 枚 Public Test 主分数相对 2026-09-07 旧文件发生位移（最大 0.167pp）。根因是评测运行时迁移到冻结环境
    cwenv，与本次源码改动无关：改动前代码在 cwenv 中复现的是新值；且评分器零改动的 robot_arm_mass 出现同形态位移（比率指标按 1/512 整数倍翻转、有升有降）。详见 docs/WIP_eval_standard_alignment.md。
