purpose:
  issue: >-
    The evaluator forms per-example MSE arrays in float32, while the public
    score command reconstructed the same JSON record values with NumPy's
    implicit float64 dtype.  A mean-margin difference below 5e-8 could
    therefore reject an otherwise unchanged frozen result.
  correction: >-
    Reconstruct only the two MSE arrays as float32 in the public rescorer,
    matching the evaluator that produced the records.
