schema_version: 1
benchmark: pusht_hidden_actuation_history3_action_coverage_v2
experiment: transition_conditional_sigreg_v1
status: registered_before_implementation_gradient_or_training
registered_at_utc: "2026-07-30"
owner: ContextWorld

research_question: >-
  Can one causally masked conditional SIGReg statistic protect both the
  online transition target and the History-conditioned prediction, while
  retaining ordinary Push-T planning calibration?

method:
  id: transition_conditional_sigreg
  display_name_zh: 转移条件 SIGReg
  implementation_primitive: stable_worldmodel.wm.loss.GroupBalancedSIGReg
  loss_formula: prediction_mse_plus_lambda_times_one_transition_sigreg_scalar
  native_target_sigreg_replaced_not_stacked: true
  external_regularizer_weight_count: 1
  additional_loss_components: 0
  additional_model_heads: 0
  variance_covariance_invariance_or_distillation_terms: false
  planner_or_cem_changes: false
  hidden_rule_or_class_label_consumed: false

transition_population:
  definition: >-
    At transition index t, concatenate the online real-future target z[t+1]
    and the model prediction z_hat[t+1] into one population Y[t].
  formula: Y_t = concat_batch(z_target_t, z_prediction_t)
  marginal_group: complete_Y_t_population
  conditional_group: causally_valid_condition_matched_differences
  active_group_formula: >-
    0.5 * (SIGReg(Y_t) +
    SIGReg(condition_matched_difference(Y_t) / sqrt(2)))
  inactive_group_formula: SIGReg(Y_t)
  shared_random_projections_between_groups: true

causal_pair_mask:
  transition_t0_to_probe_future_x1:
    target_pair_difference_active: true
    prediction_pair_difference_active: false
    reason: >-
      The two real probe futures differ and must remain represented, but the
      hidden actuator gain is not identifiable from the common x0 and action.
  transition_t1_to_recovery_x2:
    target_pair_difference_active: false
    prediction_pair_difference_active: false
    reason: the paired trajectories return to a common visible query.
  transition_t2_to_history_conditioned_future_x3:
    target_pair_difference_active: true
    prediction_pair_difference_active: true
    reason: >-
      The real futures differ and the earlier x1 observation makes the gain
      identifiable from History=3.

immutable_inputs:
  hidden_data: artifacts/synthesis/pusht_hidden_actuation_h3_v1
  hidden_manifest_sha256: 4f307a60920747506c1d8aadc41931a0f768b7f3d7ba6317d7246b008bc3fc64
  original_data: external/pusht/lewm_pusht.lance
  action_normalizer_source: external/pusht/pusht_expert_train.h5
  source_checkpoint: external/pusht/pusht_lewm_baseline_seed3073_weights.ckpt
  source_checkpoint_sha256: 9f13b2c28bb909338047e08d62bf6eb16ea3616cb53e57cfa9b5072b43db1c59

gradient_calibration:
  seed: 7169
  batch_size: 128
  original_samples: 64
  hidden_samples: 64
  hidden_pairs: 32
  random_projection_seed: 97031
  num_projections: 1024
  candidate_external_weights: [0.005, 0.01, 0.02, 0.05, 0.09]
  selection: >-
    Select the smallest registered coefficient for which every gradient gate
    passes. Do not select a coefficient from training or evaluation metrics.
  gates:
    target_probe_x1_pair_distance_expands: true
    target_history_future_x3_pair_distance_expands: true
    predicted_correct_future_margin_x3_increases: true
    standard_replay_prediction_mse_decreases: true
    irreducible_prediction_x1_pair_not_conditionally_regularized: true
    marginal_gradient_reaches_ordinary_rows: true
    target_difference_gradient_reaches_hidden_rows: true
    prediction_difference_gradient_reaches_hidden_x3_rows: true
  stop_before_training_if_no_weight_passes: true
  maximum_allowed_external_weight: 0.09

held_out_training:
  seed: 8193
  seed_unread_at_registration: true
  optimizer_steps: 2048
  batch_size: 128
  original_samples_per_batch: 64
  hidden_samples_per_batch: 64
  hidden_pairs_per_batch: 32
  optimizer: AdamW
  learning_rate: 5.0e-5
  weight_decay: 1.0e-3
  gradient_clip_norm: 1.0
  precision: bf16_mixed
  exact_same_batches_between_variants: true
  variants:
    - id: mixed_native_sigreg_0p09
      role: same_seed_original_lewm_control
    - id: transition_conditional_sigreg_selected_weight
      role: primary_method

hidden_prediction_gate:
  target_selection_minimum: 0.95
  correct_history_minimum: 0.95
  rule_switch_minimum: 0.95
  worst_mode_minimum: 0.90

standard_pusht_followup:
  run_only_after_primary_hidden_prediction_pass: true
  evaluate_same_seed_control_and_primary: true
  protocol: exact_standard_history3_cem_300x30_top30
  eval_seeds: [42, 43, 44, 45, 46, 47]
  queries_per_seed: 50
  paired_noninferiority_margin_absolute: 0.05
  unchanged_source_checkpoint_secondary_reference: true

hidden_actuation_followup:
  run_only_after_hidden_prediction_and_standard_noninferiority_pass: true
  eval_seed: 8192
  query_pairs: 50
  oracle_grid_success_minimum: 0.95
  mode_action_classification_minimum: 0.90
  real_environment_success_minimum: 0.80

decision_rules:
  - Do not add native target SIGReg, IDM, distillation, auxiliary heads, or
    planner tuning to rescue this registered method.
  - Do not activate a prediction contrast on the irreducible x1 transition.
  - Do not change the weight grid, gradient gates, training seed, steps, or
    ability thresholds after reading calibration results.
  - If no coefficient at or below 0.09 passes all gradient gates, reject this
    formula before full training.
  - If hidden prediction fails, stop before all CEM evaluation.
  - If standard CEM is inferior, do not run hidden CEM or claim a solution.
  - A single-seed joint pass authorizes unchanged multi-seed replication; it
    is not itself a robustness claim.
