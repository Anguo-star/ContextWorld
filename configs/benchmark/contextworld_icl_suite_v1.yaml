extension:
  component_contract:
    required:
      - unique_component_id
      - frozen_release_yaml
      - training_data_contract
      - development_data_contract
      - public_test_data_contract
      - scoring_contract
      - model_adapter_contract
      - causal_data_contract
      - audit_function
      - command_line_entry
      - one_section_in_public_document
  public_document_template:
    subsections:
      - 任务目标
      - 数据构成
      - 评测方法
      - 基线表现
      - 适用范围
    component_sections:
      speed: 6.1 速度
      door: 6.2 门通行规则
      action_delay: 6.3 动作延迟
      action_strength: 6.4 推手移动幅度
      contact_friction: 6.5 接触摩擦
      motion_damping: 6.6 运动阻尼
      robot_arm_mass: 6.7 机械臂质量
      portal_exit: 6.8 传送门出口位置
  rule: >-
    新能力只能作为新的 component 注册。不得新增并列的总入口文档、
    独立 artifact root 或另一套顶层发布结构。

