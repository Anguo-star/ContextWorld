schema_version: 2
benchmark: tworoom_hidden_passage_history3_train_seen_diagnostic_v1
status: frozen_after_v1_train_seen_diagnostic_before_unseen_validation_scoring
date: "2026-07-24"

question: >-
  固定原始图像表示的三个双规则模型，在训练中出现过的门位置上，能否根据
  “穿过门”或“被门挡住”这两种有明确证据的三帧历史选择正确下一帧？

decision_protocol:
  name: informative_history_rule_switch_v2
  frozen_before_unseen_validation_scoring: true
  unseen_checkpoint_scores_inspected_before_freeze: false
  source_of_revision: train_seen_diagnostic_only
  supersedes_for_capability_gate:
    config: configs/benchmark/tworoom_hidden_passage_h3_fixed_representation_train_seen_eval_v1.yaml
    result: artifacts/evaluation/history3/hidden_passage_fixed_representation_train_seen_v1/aggregate.json
  reason: >-
    “没有尝试穿门”的历史没有显示门的物理规则，因此没有唯一正确的下一帧。
    v1 将它列为辅助参照，却又要求匹配历史必须在原始 latent 误差上击败它，
    会把合理的默认倾向误判为规则切换失败。v2 的能力门槛只比较“看见穿过”
    与“看见受阻”两种都有明确规则证据的历史；无证据历史仍完整评测和报告，
    但不参与通过判定。
  unchanged:
    - training_recipe_and_checkpoints
    - train_seen_catalog_and_300_queries
    - three_history_conditions_and_offline_true_futures
    - each_condition_50x6
    - target_accuracy_and_latent_separation_checks
    - seed_direction_consistency_and_paired_bootstrap

