evaluation:
  eval_seeds: [142, 143, 144, 145, 146, 147]
  eval_seed_semantics: seeded_disjoint_without_replacement_query_sets
  unique_queries_per_seed: 50
  unique_queries: 300
  model_predictions_per_checkpoint: 900
  loss_records_per_checkpoint: 1800
  batch_size: 64
  environment_calls_during_scoring: 0

adapter:
  implementation: StableWorldModelLeWMAdapter
  normalizer: artifacts/splits/tworoom_original_train_s3072_normalizer.json
  normalizer_sha256: 7a5be7ea867bced446c1671b0b2c0ff6450ffc61e1a7bdbbfc5eaa0942f635db
  model_input_keys: [pixels, action]

metrics:
  primary: frozen_true_next_frame_native_latent_mse
  capability_gate:
    - matching_history_loss_vs_opposite_evidence_history_loss
    - matching_history_two_target_accuracy
    - matching_vs_opposite_history_win_rate
    - eval_seed_and_direction_sign_consistency
    - paired_bootstrap_confidence_bounds
    - target_latent_separation
  auxiliary:
    - no_crossing_attempt_history_loss
    - matching_vs_no_crossing_attempt_loss
    - all_three_histories_strict_win_rate
  no_crossing_attempt_role: auxiliary_default_tendency_only
  raw_latent_mse_cross_checkpoint_comparison_allowed: false

gates:
  decision_contract: informative_history_rule_switch_v2
  minimum_middle_state_gap_px: 5.0
  minimum_future_state_gap_px: 25.0
  minimum_same_history_two_target_accuracy_exclusive: 0.5
  require_target_accuracy_above_threshold_in_every_eval_seed_direction: true
  minimum_matching_vs_opposite_history_win_rate_exclusive: 0.5
  minimum_target_pair_latent_mse_exclusive: 1.0e-12
  paired_bootstrap:
    unit: static_query_within_eval_seed_direction
    strata: eval_seed_x_direction
    method: percentile
    resamples: 10000
    confidence: 0.95
    seed: 20260727
    minimum_lower_bound_exclusive: 0.0
    required_metrics:
      - passable/same_vs_other_rule_history
      - blocked/same_vs_other_rule_history
      - passable/matching_history_two_target_margin
      - blocked/matching_history_two_target_margin

comparison:
