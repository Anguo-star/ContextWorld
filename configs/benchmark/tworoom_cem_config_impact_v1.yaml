schema_version: 1
benchmark: tworoom_cem_config_impact_v1
status: preregistered_before_formal_execution
preregistered_date: 2026-07-20

question:
  primary: >-
    At a fixed 100-raw-step execution budget, is the remaining
    SpeedFull Fast-minus-Slow success gap caused mainly by limited model
    lookahead or by insufficient CEM search?
  boundary: >-
    This validation experiment diagnoses the existing SpeedFull plus CEM
    chain. It does not train a new model and is not the final benchmark Test.

evidence_boundary:
  stage: validation_planner_mechanism
  final_test: false
  model: h3_speedfull_s3072
  training_seeds: [3072]
  no_post_score_configuration_changes: true
  no_finite_configuration_called_unlimited_cem: true

feasibility_preflight:
  completed_before_freeze: true
  eval_seed: 991
  evaluations_per_condition: 1
  run_kind: qualitative_probe
  results_used_for_parameter_selection: false
  predetermined_scale_from_baseline: 2
  checked_variants: [horizon10, samples600, iterations60]
  outcome_fields_excluded_from_decision: true
  passed_without_oom: true

frozen_inputs:
  stable_worldmodel_commit: 5864b74980f6ed328fd0045e777b3865962eff43
  model:
    path: artifacts/training/runs/checkpoints/h3_speedfull_s3072/weights_final_step_12840.pt
    sha256: 79e2b2d17445a21d1685759679c6ab82f9fda834584168d7e3e02bf50b78a778
  normalizer:
    path: artifacts/splits/tworoom_original_train_s3072_normalizer.json
    sha256: 7a5be7ea867bced446c1671b0b2c0ff6450ffc61e1a7bdbbfc5eaa0942f635db
  catalogs:
    wrong_slow:
      path: artifacts/evaluation/history3/icl_sensitive_v2_directional/catalogs/heldout_wrong_slow.json
      sha256: d692736d9d6aeb270f8b4edb8e9849c44f546c580555e97cc03dca4b953da318
    wrong_fast:
      path: artifacts/evaluation/history3/icl_sensitive_v2_directional/catalogs/heldout_wrong_fast.json
      sha256: 1addd90144d8d442f6ee996ea9ad7a69c58cd643a96478046ba83f2341834e40
  prior_mechanism_summary:
    path: artifacts/evaluation/history3/planner_mechanism_v1/final_summary_n50x6.json
    sha256: f3daeb2c5c50386634c1d966a6ee3d20a62de6021856861a7e1e6abdd0ec4663

shared_protocol:
  eval_budget_raw_steps: 100
  action_block_raw_steps: 5
  receding_horizon_action_blocks: 5
  cem_batch_size: 1
  cem_var_scale: 1.0
  cem_topk: 30
  warm_start: true
  success_radius_px: 16
  eval_seeds: [42, 43, 44, 45, 46, 47]
  evaluations_per_condition_per_seed: 50
  evaluations_per_condition: 300
  directional_evals: [wrong_slow, wrong_fast]
  conditions_per_directional_eval: [correct, wrong]
  raw_records_per_configuration: 1200
  unique_slow_correct_fast_records_per_configuration: 900
  require_full_50x6_for_each_eval_and_condition: true
  require_identical_query_schedule_across_configurations: true
  require_identical_initial_cem_seed_across_configurations: true
  require_correct_condition_duplicate_audit_across_directional_evals: true

configurations:
  baseline:
    role: existing_reference
    horizon_action_blocks: 5
    lookahead_raw_steps: 25
    cem_samples: 300
    cem_iterations: 30
    cem_topk: 30
    source_root: artifacts/evaluation/history3/planner_mechanism_v1/closed_loop/budget_100/h3_speedfull_s3072
  horizon10:
    role: longer_model_lookahead_only
    changed_parameter: horizon_action_blocks
    horizon_action_blocks: 10
    lookahead_raw_steps: 50
    cem_samples: 300
    cem_iterations: 30
    cem_topk: 30
  samples600:
    role: wider_cem_population_only
    changed_parameter: cem_samples
    horizon_action_blocks: 5
    lookahead_raw_steps: 25
    cem_samples: 600
    cem_iterations: 30
    cem_topk: 30
  iterations60:
    role: deeper_cem_optimization_only
    changed_parameter: cem_iterations
    horizon_action_blocks: 5
    lookahead_raw_steps: 25
    cem_samples: 300
    cem_iterations: 60
    cem_topk: 30

formal_execution:
  new_configurations: [horizon10, samples600, iterations60]
  new_closed_loop_raw_records: 3600
  baseline_closed_loop_raw_records_reused: 1200
  total_matrix_raw_records: 4800
  score_blind_resume_and_reuse_checks: true

primary_analysis:
  estimand: >-
    For each variant, [(Fast - Slow) success gap under the variant] minus
    [(Fast - Slow) success gap under the baseline], in percentage points.
  pairing_unit: eval_seed_and_evaluation_id
  expected_pairs: 300
  bootstrap:
    method: paired_seed_stratified
    resamples: 50000
    seed: 20260720
    confidence_level: 0.95
  randomization_test:
    method: paired_sign_flip_monte_carlo
    resamples: 200000
    seed: 20260721
  multiplicity:
    method: holm
    family: [horizon10, samples600, iterations60]
    alpha: 0.05
  practical_reduction_threshold_percentage_points: 3.0
  primary_driver_fraction_of_baseline_gap: 0.5
  practical_equivalence_margin_percentage_points: 3.0

decision_rules:
  contributes: >-
    The variant reduces the Fast-minus-Slow gap by at least 3 percentage
    points, the paired bootstrap interval for the change is wholly below
    zero, and the Holm-adjusted randomization p-value is below 0.05.
  primary_driver: >-
    The contributes rule passes and the observed reduction is at least half
    of the baseline Fast-minus-Slow gap.
  gap_resolved: >-
    The 95% interval for the variant Fast-minus-Slow gap lies completely
    inside plus or minus 3 percentage points.
  horizon_interpretation: >-
    Only horizon10 passing supports limited model lookahead as a contributor.
  search_interpretation: >-
    samples600 or iterations60 passing supports insufficient CEM search as a
    contributor.
  no_variant_passes: >-
    The tested resource limits do not explain the residual gap. Remaining
    candidates are model prediction or cost bias and untested replanning
    behavior; no single one is declared proven without the diagnostic.

secondary_metrics:
  - success_by_condition
  - correct_minus_slow_success
  - fast_minus_correct_success
  - final_distance_px
  - normalized_progress
  - normalized_distance_auc
  - paired_steps_to_success_on_common_successes
  - per_seed_effects
  - elapsed_seconds
  - cem_solve_calls
  - candidate_cost_evaluations
  - candidate_rollout_blocks

long_horizon_prediction_diagnostic:
  required: true
  records: 300
  eval_seeds: [42, 43, 44, 45, 46, 47]
  evaluations_per_seed: 50
  contexts: [slow, correct, fast]
  probe_first_25_raw_steps: >-
    Reconstruct the frozen goal_directed_mixture_v1 candidate bank and select
    the exact correct-speed terminal-distance argmin.
  probe_last_25_raw_steps: zero_raw_actions
  observed_horizons_raw_steps: [5, 10, 15, 20, 25, 30, 35, 40, 45, 50]
  metric: native_latent_mse_to_true_query_speed_rollout
  groups:
    first_25: [5, 10, 15, 20, 25]
    last_25: [30, 35, 40, 45, 50]
  interpretation: >-
    This diagnostic checks whether longer lookahead is undermined by
    autoregressive prediction drift. It remains separate from closed-loop
    success and is not folded into a single score.

artifacts:
  root: artifacts/evaluation/history3/cem_config_impact_v1
  closed_loop: artifacts/evaluation/history3/cem_config_impact_v1/closed_loop
  long_horizon_prediction: artifacts/evaluation/history3/cem_config_impact_v1/long_horizon_prediction
  final_summary: artifacts/evaluation/history3/cem_config_impact_v1/final_summary_n50x6.json
