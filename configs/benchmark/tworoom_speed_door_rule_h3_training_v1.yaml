passage_support:
  passage_passable:
    train: [1]
    validation: [1]
  passage_blocked:
    train: [0]
    validation: [0]
  passage_mixed:
    train: [0, 1]
    validation: [0, 1]
  training_speeds: [2.7, 4.3, 6.1, 7.7]
  eval_speeds: [3.1, 5.1, 7.0]
  eval_only_door_positions:
    [30, 34, 38, 42, 46, 50, 54, 58, 62, 66, 70, 74, 78, 82, 86,
     90, 94, 98, 102, 106, 110, 114, 118, 122, 126, 130, 134, 138,
     142, 146, 150, 154, 158, 162, 166, 170, 174, 178, 182, 186, 190,
     194]
  requirements:
    - no_exact_train_eval_speed_overlap
    - all_eval_speeds_inside_training_range
    - training_and_loader_validation_exclude_every_eval_only_door
    - selected_validation_query_pixels_excluded_from_training

paired_collection_contract:
  passage_rules:
    pair_identity: [split, pair_id]
    allowed_difference: passage.open
    passable_value: 1
    blocked_value: 0
    equal_manifest_fields:
      - split
      - regime
      - stable_worldmodel_commit
      - pixel_codec
      - seed_group
      - pair_id
    equal_manifest_count_fields:
      - episode_count
      - clip_count
      - rows_per_episode
      - raw_rows
    equal_episode_fields:
      - pair_id
      - agent_speed
      - direction
      - door_position
      - doorway_offset_px
      - action_sha256
      - initial_pixels_sha256
      - query_pixels_sha256
      - goal_pixels_sha256
      - model_input_keys
      - passed
    allowed_episode_differences:
      - rule
      - passage_open
      - middle_pixels_sha256
      - future_pixels_sha256
      - model_pixels_sha256
      - model_proprio_sha256
      - raw_pixels_sha256
      - raw_proprio_sha256
      - raw_state_sha256
      - raw_variation_passage_open_sha256

