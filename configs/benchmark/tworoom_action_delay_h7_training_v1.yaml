schema_version: 1
benchmark: tworoom_action_delay_history7_training_v1
status: data_generated_audited_and_eight_gpu_runtime_frozen_before_formal_training
preregistered_date: "2026-07-29"

question: >-
  在共同的 History=7 初始化、训练预算、几何和动作下，包含延迟 0、4、8 的
  多延迟训练是否比只包含延迟 4 的单延迟训练更能根据历史适应动作响应延迟？

stable_worldmodel:
  repo: ../stable-worldmodel
  commit: ad2bc44579f2b5b65c004fd2c9d8edc8ebaa43ce

data:
  original_read_only: ../../data/world_model/quentinll/lewm-tworooms/tworoom.h5
  original_split:
    strategy: episode_heldout
    seed: 3072
    train_fraction: 0.9
  frozen_normalizer:
    path: artifacts/splits/tworoom_original_train_s3072_normalizer.json
    sha256: 7a5be7ea867bced446c1671b0b2c0ff6450ffc61e1a7bdbbfc5eaa0942f635db
    protocol: tworoom_original_train_s3072_unbiased_zscore_v1
    statistics_scope: original_9000_train_episodes_only
  formal_build_report:
    path: artifacts/synthesis/action_delay_h7_v1/build_report.json
    sha256: 809b22f0230a92a327963afc6a0c31ef206d3db2ffb7b21cfc2c51fcae1b0aa8
