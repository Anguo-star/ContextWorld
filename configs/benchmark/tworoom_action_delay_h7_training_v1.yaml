    maximum_peak_allocated_mib: 25308.50048828125
    maximum_peak_reserved_mib: 26850.0
    minimum_total_memory_mib: 81230.625
    minimum_reserved_headroom_mib: 54380.625
    maximum_peak_reserved_fraction: 0.33054035962421807
    every_rank_passed: true
  preflight_reports:
