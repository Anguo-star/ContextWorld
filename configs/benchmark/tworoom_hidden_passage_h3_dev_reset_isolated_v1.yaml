schema_version: 2
benchmark: tworoom_hidden_passage_history3_dev_reset_isolated_v1
status: diagnostic_frozen_before_catalog_generation_and_scoring
date: "2026-09-09"

# Second Development replica of the frozen Public Test validation protocol
# (tworoom_hidden_passage_h3_validation_v2), identical to
# tworoom_hidden_passage_h3_dev_structural_parity_v1 in every structural
# respect (three history conditions, eval_seed x direction stratification
# 6 x 2 x 25, 2x3 matrix, physics gates, bootstrap), with one addition
# requested by the S3 conservative reading: no Development reset tuple may
# coincide with ANY Public Test reset tuple, at candidate level.
#
# The loader_val-only pool of the v1 build cannot satisfy that addition:
# after removing reset-tuple collisions the 320-candidate pool keeps only
# 171 templates (84/87 per direction) < the required 150 per direction.
# This build therefore draws from the complete frozen formal-scale training
# geometry (train ∪ loader_val, 112 door positions), still disjoint from
# every eval-only Test door, and drops every template whose reset tuple
# appears among the 286 unique Public Test *candidate* reset tuples (a
# superset of the 264 tuples Test actually selected).

source_protocol: configs/benchmark/tworoom_hidden_passage_h3_validation_v2.yaml
supersedes: configs/benchmark/tworoom_hidden_passage_h3_dev_structural_parity_v1.yaml

stable_worldmodel:
  # Absolute path to the pinned-commit extraction used by this build; the
  # working checkout at ../stable-worldmodel is on another branch.
  repo: /tmp/claude-0/-opt-huawei-explorer-env-dataset-ag-data-code-ContextWorld/e833990b-256b-4cc7-adbd-29b6d6a816f0/scratchpad/audit/I2_swm_pinned
  commit: 5864b74980f6ed328fd0045e777b3865962eff43

history3:
  history_tokens: 3
  raw_steps_per_action_block: 5
  query_future_blocks: 1
  true_future_rules: [passable, blocked]
  history_conditions:
    observed_passable: 看见智能体穿过门的历史
    observed_blocked: 看见智能体被门挡住的历史
    did_not_attempt_crossing: 没有尝试穿门的历史
  all_three_histories_use_identical_actions: true
  all_three_histories_end_at_identical_query: true
  no_crossing_attempt_is_continuous_environment_history: true

