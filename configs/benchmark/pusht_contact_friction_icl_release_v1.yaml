  causal_pair_contents:
    - 两种摩擦条件从同一个可见起点出发，并执行完全相同的动作
    - 起点之后不写入状态，也不重建模拟器；两条轨迹都由环境连续向前运行
    - 历史接触结束后至少连续三步无接触，再自然到达共同的当前状态
    - 当前画面和查询动作完全相同，完整物理状态差异不超过 0.00001
