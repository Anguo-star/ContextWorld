schema_version: 1
record_id: contextworld_icl_suite_v2_integrity_reseal_v2_predecision_regeneration_v1
status: preregistered_before_decision_regeneration
created_utc: "2026-08-19"

# Why this record exists
#
# The Suite v2 integrity-reseal-v2 decision was generated on 2026-08-17 and
# bound the four final public documents to their bytes at that moment.  The
# public benchmark document has since gained section 5.2's three-training-seed
# original-baseline family table (the seed-completion work frozen by
# ``contextworld_original_baseline_seed_completion_results_freeze_v1``), so the
# document no longer matches the identity recorded in that decision and
# ``validate_integrity_reseal_v2_decision`` correctly refuses it.
#
# This is NOT the prohibited in-place retry of a published result.  The entire
# integrity-reseal system -- the v1 and v2 preregistrations, both decisions,
# the authority modules and their tests -- is still uncommitted work in the
# release-preparation tree; none of it has ever entered repository history or
# been published.  The rule that forbids deleting a failed namespace and
# retrying in place (see the Cube Public v1 namespace) protects artifacts that
# became public record.  Here the reseal decision has not yet been released,
# and the correct end state is a decision that binds the documents as they are
# actually published, not one that binds a superseded draft.
#
# A successor reseal-v3 identity was considered and rejected: manufacturing a
# v2 -> v3 lineage would tell future readers that a published seal failed and
# was succeeded, which did not happen.  The seal is regenerated once, before
# first publication, and this record preserves the superseded bytes so the
# regeneration itself remains auditable.

scope:
  reseal_id: contextworld_icl_suite_v2_integrity_reseal_v2
  action: regenerate_the_unpublished_decision_against_final_document_bytes
  regeneration_count_authorized: 1
  successor_identity_created: false
  published_artifact_modified: false
  result_based_retry: false
  scoreboard_mutation_authorized: false
  public_test_rerun_authorized: false
  training_or_checkpoint_selection_authorized: false
  document_content_change_authorized: false   # the documents are already final
  reseal_preregistration_modified: false      # the v2 yaml stays byte-identical

publication_status_evidence:
