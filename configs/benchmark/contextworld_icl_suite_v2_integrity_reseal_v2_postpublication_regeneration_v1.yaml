# Why this record exists, and how it differs from its predecessor
#
# The predecessor record
# ``contextworld_icl_suite_v2_integrity_reseal_v2_predecision_regeneration_v1``
# regenerated the integrity-reseal-v2 decision once, BEFORE the seal had ever
# entered repository history.  That decision has since been committed and
# pushed (commit 45e398b), so it is now published record, and the predecessor
# record's one-use authorization is spent
# (``regeneration_count_authorized: 1``, plus
# ``further_document_edits_require_a_new_regeneration_record``).
#
# A documentation-only clarification has since been made to the public
# benchmark document, recorded in
# ``contextworld_icl_suite_v2_baseline_provenance_and_gate_disclosure_amendment_v1``:
# the provenance of the eight LeWM baseline checkpoints, and a transcription of
# the already-frozen per-task ICL gates so that a reader can see why 83.92%
# fails a 0.95 gate while 76.11% passes a 0.75 gate.  The document bytes
# therefore no longer match the published decision.
#
# Why the seal is regenerated rather than succeeded by a v3 identity
#
# The v1 -> v2 succession happened because the evaluated MATERIAL changed: the
# PLDM reference completions landed and the scoreboard gained an additive
# resolution, so the seal needed new verification logic.  Here nothing about
# the material changed -- no score, gate, verdict, dataset, checkpoint or
# scoreboard row moves, and the reseal authority module needs no change at
# all.  Manufacturing a v2 -> v3 generation for additive prose would drain the
# meaning from seal generations, which are supposed to mark substantive
# material change.  The already-published v2 decision is instead regenerated
# under this record, with the superseded decision archived byte-exact so the
# published seal remains auditable rather than silently replaced.
#
# The distinction this record must NOT blur: the superseded decision was
# genuinely published.  Unlike the predecessor regeneration, this one edits a
# public record, and that is disclosed here rather than presented as a
# pre-publication cleanup.

