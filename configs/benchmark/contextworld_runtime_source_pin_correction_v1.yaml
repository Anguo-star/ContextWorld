finding:
  classification: runtime_source_fingerprint_updated_behavior_unchanged
  drifted_paths:
    - contextworld/benchmarks/adapters.py
    - contextworld/evaluation/protocol.py
  drift_commits:
    - f97b7f9c91743fa06770c5f47d31eed6b213d80a
    - b0c0049d00520bd16e8112a67f31a21ed46dc528
  explanation: >-
    Code fingerprints updated in commits f97b7f9 / b0c0049.  Behaviour under
    the runtime pinned by the release contracts is unchanged: the only
    branch added to contextworld/benchmarks/adapters.py that alters control
    flow (the rollout_latents branch) consumes an action_history runtime
    constant that does not exist in the pinned stable-worldmodel ref, so the
    branch cannot activate and evaluation proceeds through the legacy path,
    which is expression-for-expression equivalent to the pinned version.
    The published results sealed against these pins remain valid; the pins
    themselves stay in the release configurations unchanged, because the
    historical result payloads embed the release yaml's own file hash.
  explanation_zh: >-
    代码指纹更新（commit f97b7f9 / b0c0049），对发布合同钉死的运行时
    swm@5864b749 行为未变（rollout_latents 的新分支在该 ref 下不激活，
    已验证 action_history 常量计数为 0），旧结果仍有效。
  inertness_verification:
    pinned_runtime_repo: ../stable-worldmodel
    # Every swm ref pinned by any contract covered by this correction:
    pinned_runtime_refs:
      - 5864b74980f6ed328fd0045e777b3865962eff43
      - 875e607fc08aa72eacb94d5d178127804134cc06
      - ad2bc44579f2b5b65c004fd2c9d8edc8ebaa43ce
    probes:
      stable_worldmodel/wm/lewm/lewm.py:
        action_history_occurrences: 0
      stable_worldmodel/wm/pldm/pldm.py:
        action_history_occurrences: 0
    probe_command: >-
      git -C ../stable-worldmodel show <ref>:stable_worldmodel/wm/
      {lewm,pldm}/{lewm,pldm}.py | grep -c action_history

