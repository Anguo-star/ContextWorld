  standard_runner_revision_note: >-
    The parent original_baseline_cem_v1 matrix pinned an earlier 26034-byte
    revision (sha ee7b6025...) of this file that is no longer on disk.  The
    on-disk 26291-byte revision is the one frozen and executed by
    contextworld_complete_reference_comparison_v1 and its execution
    amendment v2 (i.e. every context-recipe CEM row in the 18-row table).
