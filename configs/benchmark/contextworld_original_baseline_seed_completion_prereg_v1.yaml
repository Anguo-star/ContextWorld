      The evaluated tworoom/lewm cell used the repo-trained ContextWorld
      checkpoint h3_origheldout_s3072 (raw state-dict .pt, ContextWorld
      training code), not the quentinll lightning baseline lineage.  The
      lightning sibling tworoom_lewm_20260430 (seed 3072, epoch 9, global
      step 6420) carries numerically different weights (max abs tensor diff
      ~0.69; an independent training run).  For a homogeneous
      three-training-seed family statistic the lightning triplet
      3072/3073/3074 is evaluated below; the 273/300 value remains a
      disclosed historical lineage note and is never averaged into the
      family mean +/- std.

lineage_disclosures:
  - id: pldm_bare_seed3072_lazy_image_noise_config_diff
    detail: >-
      Every bare (seed-3072) PLDM config differs from its seed3073/3074
      siblings only by naming/seed plus image_noise "std_max: 0.0 ->
      0" and "noise_prob: 1 -> 0".  With the noise std upper bound at zero
      in both variants no noise is ever applied, so the recipes are
      operationally identical.
  - id: lewm_seed3072_explicit_default_block_config_diff
    detail: >-
      LeWM 3072-lineage configs predate a config-format explicitation; all
      textual differences against seed3073/3074 sit inside "enabled: false"
      blocks or other no-op default sections (verified per environment).
      pusht/tworoom 20260430 configs show zero substantive difference.
  - id: lewm_seed3075_excluded_incomplete
    detail: >-
      pusht/reacher/cube lewm seed3075 checkpoints contain epoch=4 (5 of 10
      epochs) and are excluded; tworoom seed3075 exists but 3072/3073/3074
      already complete the preregistered set.
  - id: cube_lewm_3072_directory_choice
    detail: >-
      Two independent seed-3072 cube LeWM trainings exist: bare cube_lewm
      (2026-04-23, older config format) and cube_lewm_20260430 (2026-04-30,
      config substantively identical to seed3073/3074).  The dated run is
      preregistered as the 3072 family member, consistent with the
      pusht/tworoom 3072 naming lineage.  The tensors of the two runs
      differ; this is a lineage choice made before any new score existed,
      not a result-based selection.
  - id: tworoom_lewm_3072_dual_format
    detail: >-
      See already_evaluated_family_members: the historical tworoom/lewm cell
      used h3_origheldout_s3072; the family statistic uses the lightning
      triplet.  Both facts stay disclosed side by side in the v2 report.
  - id: cube_lewm_3073_score_provenance
    detail: >-
      The cube/lewm/3073 value 198/300 originates from the retention v2
      matrix (baseline_lewm) and was adopted as the official reuse cell of
      original_baseline_cem_v1 under an exact-reuse contract; protocol,
      catalog (sha 0ebf7fa6...), dataset, runtime, and CEM constants are
      identical to this preregistration, so it is family-comparable without
      re-execution.

