schema_version: contextworld.stablewm-family-profiles.v1
status: public_reproduction_contract

upstream:
  repository: https://github.com/galilai-group/stable-worldmodel
  validated_revision: addbab40377da680dadbfbc90250fe749f6f57e3
  note: >-
    The launcher calls the selected checkout's own trainer. ContextWorld maps
    a stable command-line interface to each trainer's Hydra schema; it does
    not copy the model, forward pass, loss, or optimizer implementation.

defaults:
  baseline_seeds: [3072, 3073, 3074]
  frameskip: 5
  history_size: 3
  num_preds: 1
  contextworld_num_workers_per_rank: 2
  prejepa_action_delay_precision: bf16-mixed
  logger: none
  resume: auto

comparison_recipe:
  original_environment_baseline:
    max_epochs: 10
    batch_size_per_device: 128
    reference_devices: 8
    gradient_accumulation: 1
    effective_global_batch_size: 1024
    note: >-
      These values reproduce the training scale of the frozen LeWM/PLDM
      original-environment baselines. PreJEPA's upstream YAML uses batch 32,
      so the ContextWorld cloud router raises it to 128 unless explicitly
      overridden. On fewer devices, increase gradient accumulation to retain
      the effective global batch.
  benchmark_component_joint_scratch_v1:
    task_checkpoint_initialization: none
    original_weight: 0.5
    synthetic_weight: 0.5
    note: >-
      All four built-in StableWM families train each component from their
      native model initialization, never from an original-environment task
      checkpoint. They share the registered ContextWorld-v1 payload,
      original/synthetic mixture, task geometry, training seeds, epoch count,
      batch size and post-training evaluation budget. Family-native backbones,
      objectives and optimizers remain different by design.

methods:
  native:
    description: >-
      The family's own objective, unchanged. No ContextWorld loss term is
      rendered and the registered joint-scratch mixture is used as-is. This is
      the default for every family, track and component.
  coja_v1:
    description: >-
      One-step conditional-joint training. A relation-aware batch sampler keeps
      public Contact pairs together inside the native flat batch while retaining
      the registered 50/50 original/ContextWorld mixture. It adds no model
      parameter, encoder, adapter, head or inference change.
      This is a training/data-relation overlay, not a model family: every base
      family listed below keeps its own backbone, objective and optimizer and
      renders the same registered loss keys.
    families: [lewm, viswm, pldm, prejepa]
    training_tracks: [joint_scratch_v1]
    weight: 0.09
    keys:
      enabled: loss.conditional_joint.enabled
      weight: loss.conditional_joint.weight
      group_width: loss.conditional_joint.group_width
    upstream_config_group: conditional_joint
    note: >-
      This first unified-entry validation intentionally supports only Contact
      Friction. Other components fail closed until their own public relation
      semantics are wired and tested. A family whose checkout does not expose
      loss.conditional_joint also fails closed; ContextWorld never adds the
      loss family itself.
    components:
      contact_friction:
        group_width: 2
        relation: public_pair_identity_v1
        payload_id: data
        original_weight: 0.5
        synthetic_weight: 0.5

families:
  lewm:
    entrypoint: scripts/train/lewm.py
    config_name: lewm
    data_group: true
    logger_backends: [none, swanlab, wandb]
    post_train_eval: validated
    keys:
      dataset: data.dataset.name
      batch_size: loader.batch_size
      num_workers: loader.num_workers
      persistent_workers: loader.persistent_workers
      prefetch_factor: loader.prefetch_factor
      pin_memory: loader.pin_memory
      frameskip: data.dataset.frameskip
      history_size: wm.history_size
      num_preds: wm.num_preds
      embed_dim: embed_dim
  viswm:
    entrypoint: scripts/train/viswm.py
    config_name: viswm
    data_group: true
    logger_backends: [none, swanlab, wandb]
    post_train_eval: validated
    keys:
      dataset: data.dataset.name
      batch_size: loader.batch_size
      num_workers: loader.num_workers
      persistent_workers: loader.persistent_workers
      prefetch_factor: loader.prefetch_factor
      pin_memory: loader.pin_memory
      frameskip: data.dataset.frameskip
      history_size: wm.history_size
      num_preds: wm.num_preds
      embed_dim: embed_dim
  pldm:
    entrypoint: scripts/train/pldm.py
    config_name: pldm
    data_group: true
    logger_backends: [none, swanlab, wandb]
    post_train_eval: validated
    keys:
      dataset: data.dataset.name
      batch_size: loader.batch_size
      num_workers: loader.num_workers
      persistent_workers: loader.persistent_workers
      prefetch_factor: loader.prefetch_factor
      pin_memory: loader.pin_memory
      frameskip: data.dataset.frameskip
      history_size: wm.history_size
      num_preds: wm.num_preds
      embed_dim: wm.embed_dim
  prejepa:
    entrypoint: scripts/train/prejepa.py
    config_name: prejepa
    data_group: false
    logger_backends: [none, swanlab, wandb]
    post_train_eval: validated
    post_train_eval_note: >-
      Original-environment CEM execution was validated for TwoRoom, PushT,
      Reacher, and Cube across epoch-10 checkpoints from training seeds 3072,
      3073, and 3074. Each checkpoint completed six evaluation seeds with 50
      episodes per seed (300 episodes per checkpoint). This validates the
      execution path and supplies checkpoint-level evidence, not a formal
      benchmark score.
      State-conditioned original-data checkpoints retain a strict frozen-v1
      not-compatible row and a separate normalized-zero diagnostic.
      Benchmark-component PreJEPA fixes model inputs to pixels and actions and
      requires strict ICL.
    keys:
      dataset: dataset_name
      batch_size: batch_size
      num_workers: num_workers
      frameskip: frameskip
      history_size: wm.history_size
      num_preds: wm.num_preds

common_keys:
  seed: seed
  run_name: output_model_name
  run_subdir: subdir
  train_split: train_split
  max_epochs: trainer.max_epochs
  devices: trainer.devices
  accelerator: trainer.accelerator
  strategy: trainer.strategy
  precision: trainer.precision
  accumulate_grad_batches: ++trainer.accumulate_grad_batches
  gradient_clip_val: trainer.gradient_clip_val
  fast_dev_run: ++trainer.fast_dev_run
  limit_train_batches: ++trainer.limit_train_batches
  limit_val_batches: ++trainer.limit_val_batches
  trainer_default_root_dir: ++trainer.default_root_dir
  optimizer_lr: optimizer.lr
  optimizer_weight_decay: optimizer.weight_decay
  hydra_run_dir: hydra.run.dir
  hydra_job_chdir: hydra.job.chdir

original_environments:
  tworoom:
    data_group: tworoom
    dataset: quentinll/tworoom.h5
    encoding_key: proprio
    encoding_dim: 2
    action_dim: 2
  pusht:
    data_group: pusht
    dataset: quentinll/pusht_expert_train.h5
    encoding_key: proprio
    encoding_dim: 4
    action_dim: 2
  reacher:
    data_group: dmc
    dataset: quentinll/reacher.h5
    encoding_key: observation
    encoding_dim: 6
    action_dim: 2
  cube:
    data_group: ogb
    dataset: quentinll/ogbench/cube_single_expert.h5
    encoding_key: observation
    encoding_dim: 28
    action_dim: 5

benchmark_components:
  speed:
    environment: tworoom
    data_group: tworoom
    history_size: 3
    action_dim: 2
    model_inputs: [pixels, action]
    joint_scratch_training:
      payload_id: data
      original_weight: 0.5
      synthetic_weight: 0.5
  door:
    environment: tworoom
    data_group: tworoom
    history_size: 3
    action_dim: 2
    model_inputs: [pixels, action]
    joint_scratch_training:
      payload_id: data
      original_weight: 0.5
      synthetic_weight: 0.5
  action_delay:
    environment: tworoom
    data_group: tworoom
    history_size: 7
    action_dim: 2
    model_inputs: [pixels, action]
    joint_scratch_training:
      payload_id: full
      original_weight: 0.5
      synthetic_weight: 0.5
      note: >-
        PreJEPA defaults to bf16-mixed for this History=7 component. Three
        independent 16-mixed runs reached a non-finite loss after otherwise
        finite training, at different epochs and batches. An explicit
        CW_PRECISION or --precision value still takes precedence.
  portal_exit:
    environment: tworoom
    data_group: tworoom
    history_size: 3
    action_dim: 2
    model_inputs: [pixels, action]
    joint_scratch_training:
      payload_id: data
      original_weight: 0.5
      synthetic_weight: 0.5
  action_strength:
    environment: pusht
    data_group: pusht
    history_size: 3
    action_dim: 2
    model_inputs: [pixels, action]
    joint_scratch_training:
      payload_id: data
      original_weight: 0.5
      synthetic_weight: 0.5
  contact_friction:
    environment: pusht
    data_group: pusht
    history_size: 3
    action_dim: 2
    model_inputs: [pixels, action]
    joint_scratch_training:
      payload_id: data
      original_weight: 0.5
      synthetic_weight: 0.5
  motion_damping:
    environment: pusht
    data_group: pusht
    history_size: 3
    action_dim: 2
    model_inputs: [pixels, action]
    joint_scratch_training:
      payload_id: data
      original_weight: 0.5
      synthetic_weight: 0.5
  robot_arm_mass:
    environment: reacher
    data_group: dmc
    history_size: 3
    action_dim: 2
    model_inputs: [pixels, action]
    joint_scratch_training:
      payload_id: data
      original_weight: 0.5
      synthetic_weight: 0.5
  cube_gripper_carry:
    environment: cube
    data_group: ogb
    history_size: 3
    action_dim: 5
    model_inputs: [pixels, action]
    joint_scratch_training:
      payload_id: data
      original_weight: 0.5
      synthetic_weight: 0.5

evaluation:
  entrypoint: scripts/plan/eval_wm.py
  original_config_names:
    tworoom: tworoom
    pusht: pusht
    reacher: reacher
    cube: cube
  default_seeds: [42, 43, 44, 45, 46, 47]
  default_num_eval: 50
  note: >-
    The standard post-training suite evaluates 50 episodes for each of six
    seeds (42 through 47), for 300 original-environment MPC/CEM episodes per
    checkpoint, and then attempts the applicable ContextWorld component
    evaluators. Outputs remain per-checkpoint evidence and do not create formal
    scoreboard rows.
